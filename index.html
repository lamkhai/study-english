<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Từ vựng</title>
<meta name="theme-color" content="#22314f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1424" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Từ vựng">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/form.css">
<link rel="stylesheet" href="css/lib.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button class="stats" id="stats" type="button"></button>
    <button class="tool" id="btnLib" type="button" aria-label="Tất cả từ và thống kê">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
    <button class="tool" id="btnAdd" type="button" aria-label="Thêm từ mới">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="tool" id="btnSync" type="button" aria-label="Đồng bộ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span class="count" id="badge" hidden></span>
    </button>
    <button class="tool" id="btnSettings" type="button" aria-label="Cài đặt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main class="deck">
    <article class="card" id="card" aria-live="polite"></article>
  </main>

  <p class="hint" id="hint">Vuốt ngang để đổi thẻ</p>
  <div class="bar">
    <button id="btnMaster" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      Đã nắm rõ
    </button>
    <button class="next" id="btnNext" type="button">
      Thẻ tiếp
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast" role="status">
  <span id="toastMsg"></span>
  <button id="toastAct" type="button" hidden></button>
</div>

<dialog id="dlg">
  <h2>Kết nối Google Sheet</h2>
  <label for="inSheet">Link Google Sheet</label>
  <input id="inSheet" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://docs.google.com/spreadsheets/d/…">
  <p class="info tip" id="help" hidden></p>
  <label for="inKey">Mã bí mật</label>
  <input id="inKey" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Sheet mới thì bỏ trống, app tự tạo mã">
  <label for="inUrl" id="lblUrl">Link Apps Script (đuôi /exec)</label>
  <input id="inUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
  <p class="info" id="info"></p>
  <button class="lnk" id="btnSeeChg" type="button" hidden>Xem thay đổi</button>
  <div class="actions">
    <button id="btnClose" type="button">Đóng</button>
    <button id="btnSave" type="button" class="primary">Lưu và đồng bộ</button>
  </div>
</dialog>

<dialog id="dlgChg" class="full lib" aria-labelledby="chgTitle">
  <div class="ptop">
    <h2 id="chgTitle">Thay đổi chưa đồng bộ</h2>
    <button class="x" id="btnChgClose" type="button" aria-label="Đóng">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="scroll chg" id="chgBox">
    <p class="note" id="chgNote"></p>
    <div id="chgBody"></div>
  </div>
  <div class="actions pbar">
    <button id="btnChgAll" type="button" class="del">Bỏ tất cả</button>
    <button id="btnChgSync" type="button" class="primary">Đồng bộ</button>
  </div>
</dialog>

<dialog id="dlgAdd">
  <h2 id="addTitle">Thêm từ mới</h2>
  <label for="inTerm">Từ</label>
  <div class="termrow">
    <input id="inTerm" type="text" autocomplete="off" autocapitalize="none" enterkeyhint="next" placeholder="make up for" autofocus>
    <button id="btnRename" type="button" hidden>Đổi chữ</button>
    <button id="btnUnpick" class="icon" type="button" aria-label="Thôi sửa từ này, gõ từ khác" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="chips" id="termSugg" role="group" aria-label="Từ đã có trong bộ thẻ"></div>
  <p class="info warn" id="addMsg" role="status" hidden></p>
  <label for="inPhonetic">Phiên âm</label>
  <input id="inPhonetic" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="/meɪk ʌp fɔːr/">
  <label for="inType">Loại từ</label>
  <div class="tags" id="tags">
    <input id="inType" type="text" maxlength="30" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  </div>
  <div class="chips" id="sugg" role="group" aria-label="Gợi ý loại từ"></div>
  <p class="lbl">Nghĩa và ví dụ</p>
  <div id="senses"></div>
  <p class="info tip">Bọc *cụm từ* để tô đậm. Mỗi ví dụ một dòng.</p>
  <div id="looseBox" hidden>
    <label for="inLoose">Ví dụ chưa gắn nghĩa</label>
    <textarea id="inLoose" rows="2"></textarea>
    <p class="info tip">Ví dụ có từ trước khi nghĩa và ví dụ đi thành cặp. Chuyển dần sang đúng nghĩa ở trên, hoặc cứ để đây: thẻ hiện chúng ở cuối.</p>
  </div>
  <label for="synIn">Từ đồng nghĩa</label>
  <div class="tags" id="synTags">
    <input id="synIn" type="text" autocomplete="off" autocapitalize="none">
  </div>
  <div class="chips" id="synSugg" role="group" aria-label="Gợi ý từ đồng nghĩa"></div>
  <label for="antIn">Từ trái nghĩa</label>
  <div class="tags" id="antTags">
    <input id="antIn" type="text" autocomplete="off" autocapitalize="none">
  </div>
  <div class="chips" id="antSugg" role="group" aria-label="Gợi ý từ trái nghĩa"></div>
  <label for="relIn">Từ liên quan</label>
  <div class="tags" id="relTags">
    <input id="relIn" type="text" autocomplete="off" autocapitalize="none">
  </div>
  <div class="chips" id="relSugg" role="group" aria-label="Gợi ý từ liên quan"></div>
  <div class="actions">
    <button id="btnAddDel" type="button" class="del" hidden>Xoá</button>
    <button id="btnAddClose" type="button">Đóng</button>
    <button id="btnAddSave" type="button" class="primary">Thêm</button>
  </div>
</dialog>

<dialog id="dlgDel">
  <h2 id="delTitle">Xoá từ này?</h2>
  <p class="info" id="delText"></p>
  <div class="actions">
    <button id="btnDelCancel" type="button">Huỷ</button>
    <button id="btnDelOk" type="button" class="primary danger">Xoá</button>
  </div>
</dialog>

<dialog id="dlgLib" class="full lib" aria-label="Tất cả từ và thống kê">
  <div class="ptop">
    <div class="seg" id="tabs" role="tablist" aria-label="Tất cả từ và thống kê">
      <button id="tabWords" type="button" role="tab" aria-controls="paneWords" aria-selected="true">Tất cả từ</button>
      <button id="tabStats" type="button" role="tab" aria-controls="paneStats" aria-selected="false" tabindex="-1">Thống kê</button>
    </div>
    <button class="x" id="btnLibClose" type="button" aria-label="Đóng">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="pane" id="paneWords" role="tabpanel" aria-labelledby="tabWords">
    <div class="find">
      <div class="line">
        <input id="inFind" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Tìm từ hoặc nghĩa" aria-label="Tìm từ hoặc nghĩa">
        <div class="sort">
          <select id="inSort" aria-label="Sắp xếp">
            <option value="new">Mới thêm</option>
            <option value="az">A → Z</option>
            <option value="old">Lâu chưa xem</option>
          </select>
        </div>
      </div>
      <div class="pills" id="filt" role="group" aria-label="Lọc từ">
        <button type="button" data-f="all" aria-pressed="true">Tất cả<small></small></button>
        <button type="button" data-f="learn" aria-pressed="false">Đang học<small></small></button>
        <button type="button" data-f="done" aria-pressed="false">Đã nắm rõ<small></small></button>
      </div>
    </div>
    <div class="scroll" id="wordsBox">
      <ul class="words" id="words"></ul>
      <p class="none" id="wordsNone" hidden></p>
    </div>
  </div>
  <div class="pane" id="paneStats" role="tabpanel" aria-labelledby="tabStats" hidden>
    <div class="scroll" id="statsBox">
      <div class="pills" id="units" role="group" aria-label="Thống kê theo">
        <button type="button" data-u="day" aria-pressed="true">Theo ngày</button>
        <button type="button" data-u="week" aria-pressed="false">Theo tuần</button>
        <button type="button" data-u="month" aria-pressed="false">Theo tháng</button>
      </div>
      <div id="statsBody"></div>
    </div>
  </div>
</dialog>

<dialog id="dlgView" class="full desk" aria-label="Xem từ">
  <div class="vtop">
    <button class="tool" id="btnViewBack" type="button" aria-label="Quay lại danh sách">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <p class="pos" id="viewPos"></p>
  </div>
  <div class="deck">
    <article class="card" id="viewCard"></article>
  </div>
  <p class="hint" id="viewHint"></p>
  <div class="bar">
    <button id="btnPrev" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Từ trước
    </button>
    <button class="next" id="btnNextWord" type="button">
      Từ sau
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>
</dialog>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/storage.js"></script>
<script src="js/senses.js"></script>
<script src="js/card.js"></script>
<script src="js/form.js"></script>
<script src="js/library.js"></script>
<script src="js/stats.js"></script>
<script src="js/changes.js"></script>
<script src="js/sync.js"></script>
<script src="js/main.js"></script>
</body>
</html>
