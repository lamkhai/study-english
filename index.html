<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Từ vựng</title>
<meta name="theme-color" content="#22314f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1424" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Từ vựng">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  /* Bàn học xanh mực, thẻ giấy có dòng kẻ, bút dạ quang cho cụm từ đánh dấu *...* */
  :root {
    --desk: #22314f;
    --desk-text: #e3e9f4;
    --desk-muted: #a3b2cc;
    --desk-line: rgba(255, 255, 255, .18);
    --paper: #fffefb;
    --rule: #d5e3f2;
    --ink: #1d2742;
    --pencil: #687089;
    --marker: #ffe45c;
    --mark-from: 50%;
    --badge: #ffe45c;
    --line-vocab: #e26868;
    --line-grammar: #3c9a6d;
    --danger: #c43a31;
    --danger-fill: #c43a31;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --desk: #0e1424;
      --desk-text: #dfe5f1;
      --desk-muted: #8796b2;
      --desk-line: rgba(255, 255, 255, .13);
      --paper: #18203a;
      --rule: rgba(150, 180, 230, .12);
      --ink: #e8ecf5;
      --pencil: #98a3bb;
      --marker: #d9b83c;
      --mark-from: 76%;
      --line-vocab: #d36767;
      --line-grammar: #4bae80;
      --danger: #f08a80;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--desk);
    color: var(--desk-text);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--badge); outline-offset: 2px; }

  .app {
    height: 100%;
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px calc(env(safe-area-inset-bottom, 0px) + 16px);
  }

  /* Thanh trên: số thẻ (chạm để xem thống kê), tất cả từ, thêm từ, đồng bộ, cài đặt */
  .top { display: flex; align-items: center; gap: 10px; }
  .stats {
    flex: 1;
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    font-size: 15px;
    text-align: left;
    color: var(--desk-muted);
    cursor: pointer;
    touch-action: manipulation;
  }
  .stats b { color: var(--desk-text); font-weight: 600; }
  .stats span { white-space: nowrap; }    /* màn hình hẹp thì xuống dòng giữa hai vế, không ngắt giữa vế */
  .tool {
    position: relative;
    flex: none;
    width: 42px;
    height: 42px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 1px solid var(--desk-line);
    border-radius: 12px;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
  }
  .tool svg { width: 20px; height: 20px; }
  .tool.busy svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .count {
    position: absolute;
    top: -7px;
    right: -7px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 10px;
    background: var(--badge);
    color: #1d2742;
    font-size: 11px;
    font-weight: 700;
    line-height: 20px;
    text-align: center;
  }
  .count[hidden] { display: none; }

  /* Chồng thẻ */
  .deck { position: relative; flex: 1; min-height: 0; display: flex; margin: 16px 0 14px; }
  .deck::before {
    content: "";
    position: absolute;
    inset: 12px 8px -7px;
    border-radius: 6px;
    background: var(--paper);
    opacity: .3;
    transform: rotate(-1.6deg);
  }
  .card {
    --line: var(--line-vocab);
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-radius: 6px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 1px 0 rgba(0, 0, 0, .08), 0 18px 30px -14px rgba(0, 0, 0, .55);
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
    /* Thẻ nằm trên một lớp riêng của GPU: lúc kéo, máy chỉ dịch lớp đó chứ không vẽ lại thẻ mỗi khung hình */
    will-change: transform;
    transition: transform .2s ease, opacity .2s ease;
  }
  .card.grammar { --line: var(--line-grammar); }
  .head { padding: 22px 22px 12px; border-bottom: 2px solid var(--line); }
  .term {
    margin: 0;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, Roboto, sans-serif;
    font-size: clamp(28px, 8.6vw, 40px);
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -.01em;
    overflow-wrap: anywhere;
  }
  /* Phiên âm ngay dưới từ, hiện đúng như người dùng gõ */
  .phon { margin: 6px 0 0; font-size: 17px; line-height: 1.35; color: var(--pencil); overflow-wrap: anywhere; }
  /* Dòng kẻ cách nhau 28px, chữ nằm đúng trên dòng */
  .body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 22px;
    line-height: 28px;
    overflow-wrap: anywhere;      /* link hay chuỗi dài không dấu cách thì xuống dòng, không làm thẻ phình ra ngoài màn hình */
    background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px);
    background-attachment: local;
  }
  /* Nghĩa và từ đồng nghĩa liền nhau, cách ví dụ một dòng kẻ */
  .gist { margin-bottom: 28px; }
  .meaning { margin: 0; font-size: 19px; font-weight: 500; }
  .meaning i { color: var(--pencil); }
  .syn { margin: 0; font-size: 17px; }
  .syn i { color: var(--pencil); }
  .ex { margin: 0; font-family: ui-serif, "New York", "Noto Serif", Georgia, serif; font-size: 17.5px; }
  .ex i { color: var(--pencil); }
  .card b {
    font-weight: 700;
    padding: 0 2px;
    background: linear-gradient(transparent var(--mark-from), var(--marker) var(--mark-from));
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .foot {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 22px 14px;
    font-size: 13px;
    color: var(--pencil);
  }
  .foot span:first-child { margin-right: auto; }
  .foot .seen { text-align: right; }
  /* Nút ✎ sửa thẻ: lề âm để chân thẻ không cao thêm */
  .foot .edit {
    flex: none;
    width: 32px;
    height: 32px;
    margin: -6px -8px -6px 0;
    padding: 0;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--pencil);
    cursor: pointer;
    touch-action: manipulation;
  }
  .foot .edit svg { width: 16px; height: 16px; }
  .empty { margin: auto; padding: 24px; text-align: center; line-height: 1.6; color: var(--pencil); }

  .hint { margin: 0 0 12px; text-align: center; font-size: 13px; color: var(--desk-muted); }
  /* Hai nút dưới cùng: Đã nắm rõ và Thẻ tiếp */
  .bar { display: flex; gap: 10px; }
  .bar button {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 54px;
    padding: 0 8px;
    border: 1px solid var(--desk-line);
    border-radius: 14px;
    background: rgba(255, 255, 255, .08);
    font-size: 17px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
  }
  .bar svg { flex: none; width: 20px; height: 20px; }
  .bar button:active:not(:disabled) { background: rgba(255, 255, 255, .16); }
  .bar button:disabled { opacity: .35; cursor: default; }
  /* Thẻ tiếp là nút bấm nhiều nhất nên nổi nhất: nền sáng, chữ màu bàn, ở cả chế độ sáng lẫn tối */
  .bar .next { border-color: transparent; background: var(--desk-text); color: var(--desk); }
  .bar .next:active:not(:disabled) { background: var(--desk-text); opacity: .8; }

  /* Thông báo nhỏ phía dưới */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    width: max-content;
    max-width: calc(100% - 36px);
    padding: 9px 16px;
    border-radius: 10px;
    background: var(--badge);
    color: #1d2742;
    font-size: 15px;
    line-height: 1.4;
    box-shadow: 0 12px 28px -10px rgba(0, 0, 0, .55);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 10px);
    transition: opacity .2s, transform .2s;
  }
  #toastMsg { min-width: 0; overflow-wrap: anywhere; }
  .toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .toast button {
    flex: none;
    padding: 6px 0;
    border: 0;
    background: none;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* Cài đặt */
  dialog {
    width: min(92vw, 420px);
    padding: 22px;
    border: 0;
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 24px 48px -16px rgba(0, 0, 0, .6);
  }
  dialog::backdrop { background: rgba(8, 12, 22, .55); }
  dialog h2 { margin: 0 0 4px; font-size: 20px; }
  dialog label { display: block; margin: 16px 0 6px; font-size: 14px; color: var(--pencil); }
  dialog input, dialog textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
  }
  dialog textarea { display: block; resize: vertical; }
  dialog input:focus-visible, dialog textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 0; }
  /* Loại từ: loại đã chọn nằm trong ô, chạm × để bỏ. Gõ vào ô để lọc gợi ý bên dưới, hoặc tạo loại mới */
  .tags {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 5px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    cursor: text;
  }
  .tags:focus-within { outline: 2px solid var(--ink); outline-offset: 0; }
  dialog .tags input { flex: 1; width: auto; min-width: 6em; padding: 6px 7px; border: 0; }
  dialog .tags input:focus-visible { outline: none; }
  .tag {
    display: flex;
    align-items: center;
    min-width: 0;
    max-width: 100%;
    padding-left: 12px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper);
    font-size: 15px;
    line-height: 1.4;
  }
  .tag span { min-width: 0; overflow-wrap: anywhere; }
  .tag button {
    flex: none;
    width: 32px;
    height: 30px;
    padding: 0 2px 0 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chips:empty { display: none; }
  .chips button {
    max-width: 100%;
    padding: 6px 13px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: transparent;
    font-size: 15px;
    line-height: 1.4;
    text-align: left;
    overflow-wrap: anywhere;
    cursor: pointer;
    touch-action: manipulation;
  }
  .chips .new { border-style: dashed; border-color: var(--pencil); }
  .info { margin: 16px 0 0; font-size: 13px; line-height: 1.5; color: var(--pencil); }
  .info.tip { margin-top: 6px; }
  .info.warn { margin-top: 8px; color: var(--ink); font-weight: 600; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .actions button {
    flex: 1;
    height: 46px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: transparent;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }
  .actions .primary { flex: 1.7; border-color: transparent; background: var(--ink); color: var(--paper); }
  .actions .primary:disabled { opacity: .35; cursor: default; }
  .actions .del { color: var(--danger); }
  .actions .primary.danger { background: var(--danger-fill); color: #fff; }

  /* Bảng toàn màn hình: Tất cả từ và Thống kê trên giấy; xem một từ thì trên bàn, như lúc học */
  dialog.full {
    width: 100%;
    max-width: 540px;
    height: 100%;
    max-height: none;
    margin: 0 auto;
    padding: 0;
    border-radius: 0;
    overflow: hidden;
  }
  dialog.full[open] { display: flex; flex-direction: column; }
  .ptop {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px 12px;
  }
  .seg { flex: 1; display: flex; gap: 2px; padding: 3px; border: 1px solid var(--rule); border-radius: 12px; }
  .seg button {
    flex: 1;
    height: 36px;
    padding: 0 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--pencil);
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
  }
  .seg button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  .x {
    flex: none;
    width: 44px;
    height: 44px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 1px solid var(--rule);
    border-radius: 12px;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
  }
  .x svg { width: 20px; height: 20px; }
  .lib :focus-visible { outline-color: var(--ink); }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pane[hidden] { display: none; }
  .scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 0 18px calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pills button {
    padding: 5px 12px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: transparent;
    font-size: 14px;
    line-height: 1.4;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
  }
  .pills button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  .pills small { margin-left: 5px; font-size: inherit; opacity: .7; }

  /* Tất cả từ: ô tìm, cách xếp, lọc, rồi danh sách */
  .find { flex: none; padding: 0 18px 12px; border-bottom: 1px solid var(--rule); }
  .find .line { display: flex; gap: 8px; }
  dialog .find input { flex: 1; width: auto; min-width: 0; padding: 9px 12px; }
  .sort { position: relative; flex: none; display: flex; }
  .sort select {
    -webkit-appearance: none;
    appearance: none;
    padding: 0 30px 0 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 16px;                       /* nhỏ hơn 16px thì iPhone phóng to trang khi chạm */
    cursor: pointer;
  }
  .sort::after {
    content: "";
    position: absolute;
    top: 50%;
    right: 13px;
    width: 7px;
    height: 7px;
    border: solid var(--pencil);
    border-width: 0 1.5px 1.5px 0;
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  .words { margin: 0; padding: 0; list-style: none; }
  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    column-gap: 12px;
    align-items: center;
    width: 100%;
    padding: 10px 0;
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
  }
  .row:focus-visible { outline-offset: -2px; }
  .rt, .rm { grid-column: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rt { font-size: 17px; line-height: 1.4; }
  .rt span { font-size: 14px; color: var(--pencil); }
  .rm { font-size: 15px; line-height: 1.4; color: var(--pencil); }
  .rs { grid-column: 2; grid-row: 1 / span 2; font-size: 12.5px; line-height: 1.5; text-align: right; color: var(--pencil); }
  .rs em { font-style: normal; font-weight: 600; color: var(--ink); }
  .none { margin: 40px 0; text-align: center; color: var(--pencil); }

  /* Thống kê: mỗi chỉ số một biểu đồ cột; cột đang chọn đậm màu mực, các cột khác màu bút chì */
  .metric { padding: 18px 0; border-bottom: 1px solid var(--rule); }
  .metric h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--pencil); }
  .fig { margin: 2px 0 14px; color: var(--pencil); }
  .fig b {
    margin-right: 4px;
    padding: 0 3px;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--ink);
    background: linear-gradient(transparent var(--mark-from), var(--marker) var(--mark-from));
  }
  .chart { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; }
  .yax, .plot { position: relative; height: 132px; }
  .yax { min-width: 14px; }
  .yax span {
    position: absolute;
    right: 0;
    bottom: calc(var(--y) * 100%);
    transform: translateY(50%);
    font-size: 11px;
    line-height: 1;
    color: var(--pencil);
    font-variant-numeric: tabular-nums;
  }
  .gl { position: absolute; left: 0; right: 0; bottom: calc(var(--y) * 100%); height: 1px; background: var(--rule); }
  .cols { position: absolute; inset: 0; display: flex; }
  .col {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    border: 0;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
  }
  .col i {
    display: block;
    width: min(24px, 66%);
    height: calc(var(--h) * 100%);
    border-radius: 4px 4px 0 0;
    background: var(--pencil);
  }
  .col[aria-pressed="true"] i { background: var(--ink); }
  .col:focus-visible { outline-offset: -2px; }
  @media (hover: hover) {
    .col:hover i { opacity: .75; }
    .col[aria-pressed="true"]:hover i { opacity: 1; }
  }
  .xax {
    grid-column: 2;
    display: flex;
    margin-top: 6px;
    font-size: 11px;
    line-height: 1.2;
    color: var(--pencil);
    font-variant-numeric: tabular-nums;
  }
  .xax span { flex: 1; min-width: 0; text-align: center; white-space: nowrap; }
  .xax .on { color: var(--ink); font-weight: 700; }
  .sum { margin: 12px 0 0; font-size: 13.5px; color: var(--pencil); }
  .tbl { margin-top: 16px; }
  .tbl summary { padding: 4px 0; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tbl table { width: 100%; margin-top: 8px; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .tbl th, .tbl td { padding: 6px 4px; border-bottom: 1px solid var(--rule); text-align: right; }
  .tbl th:first-child { text-align: left; font-weight: 400; }
  .tbl thead th { font-weight: 600; color: var(--pencil); }
  .note { margin: 14px 0 0; font-size: 13px; line-height: 1.5; color: var(--pencil); }

  /* Xem một từ: thẻ như lúc học, hai nút đi tới từ trước và từ sau */
  dialog.desk {
    background: var(--desk);
    color: var(--desk-text);
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  .vtop { flex: none; display: flex; align-items: center; gap: 10px; }
  .pos { flex: 1; margin: 0; text-align: right; font-size: 15px; color: var(--desk-muted); font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    .card, .toast { transition: none; }

/* ---------- Hàm tiện ích ---------- */
const pad = n => String(n).padStart(2, '0');
function validDate(iso) { return !!iso && !isNaN(Date.parse(iso)); }
function fmtDate(iso) {
  const d = new Date(iso);

}
function fmtDateTime(iso) {
  const d = new Date(iso);

function daysAgo(iso, now) {

function rich(s) { return esc(s).replace(/\*(.+?)\*/g, '<b>$1</b>'); }
function lines(s) { return String(s == null ? '' : s).split(/\r?\n/).map(l => l.trim()).filter(Boolean); }

function typesOf(type) { return String(type == null ? '' : type).split(',').map(typeName).filter(Boolean); }

function synList(s) { return String(s == null ? '' : s).split(/[,;\n]/).map(typeName).filter(Boolean); }

// Tên máy ghi ở cột device của tab log: loại máy cho dễ nhận ra, cộng 6 ký tự ngẫu nhiên
function newDevice() {
  const ua = navigator.userAgent;
  const kind = /iPhone/.test(ua) ? 'iphone' : /iPad/.test(ua) ? 'ipad' : /Android/.test(ua) ? 'android'
    : /Mac/.test(ua) ? 'mac' : /Windows/.test(ua) ? 'windows' : 'web';
  const tail = Array.from(crypto.getRandomValues(new Uint8Array(3)), b => b.toString(16).padStart(2, '0')).join('');
  return `${kind}-${tail}`;
}
function kindOf(type) {
  const raw = String(type == null ? '' : type).trim();
  const t = raw.toLowerCase().normalize('NFC');
  if (['grammar', 'ngữ pháp', 'ngu phap'].includes(t)) return { label: 'Ngữ pháp', cls: 'grammar' };
  if (['vocab', 'vocabulary', 'word', 'từ vựng', 'tu vung'].includes(t)) return { label: 'Từ vựng', cls: '' };
  return { label: raw, cls: '' };
}

/* ---------- Chọn thẻ tiếp theo ----------
   Ngẫu nhiên có trọng số: thẻ chưa xem 1.5, thẻ xem cách đây từ 3 ngày trở lên 1,
   thẻ vừa xem gần bằng 0 nên hầu như không lặp lại ngay. */
function weight(item, now) {
  if (!validDate(item.lastSeen)) return 1.5;
  const days = Math.max(0, (now - Date.parse(item.lastSeen)) / 86400000);
  return Math.min(1, 0.01 + days / 3);
}
function pickNext(list, exclude, now, rnd) {
  now = now || Date.now();
  rnd = rnd || Math.random;
  let pool = list.filter(x => !x.mastered);
  if (pool.length > 1) pool = pool.filter(x => x !== exclude);
  if (!pool.length) return null;
  const w = pool.map(x => weight(x, now));
  let r = rnd() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) {
    r -= w[i];
    if (r < 0) return pool[i];
  }
  return pool[pool.length - 1];
}

/* ---------- Lưu trong máy ---------- */
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (_) { return fallback; }
}
function store(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (_) { return false; }
}
function persist() {
  if (demo) return true;
  const ok = store(KEYS.items, items) && store(KEYS.pending, pending) && store(KEYS.edits, edits)
    && store(KEYS.deletes, deletes) && store(KEYS.log, log);
  if (!ok) toast('Không lưu được vào bộ nhớ máy. Kiểm tra dung lượng trống.');
  return ok;
}
// Số thẻ có thay đổi chưa gửi lên Sheet: tiến độ học, bản sửa, từ đã xoá, hoặc từ mới thêm trong app (mỗi thẻ tính một lần)
function unsynced() {
  const keys = new Set(Object.keys(pending).concat(Object.keys(edits), Object.keys(deletes)));
  items.forEach(x => { if (x.local) keys.add(keyOf(x)); });
  return keys.size;
}
function recordChange(item, patch) {
  Object.assign(item, patch);
  if (!demo) {
    const k = keyOf(item);
    pending[k] = Object.assign({}, pending[k], patch);
    if (patch.lastSeen) {                // mỗi lần ghi last seen lúc học là một lượt xem
      const day = dayKey(new Date(patch.lastSeen));
      log.mine[day] = (log.mine[day] || 0) + 1;
    }
    persist();
  }
  renderTop();
}
// Ngày có lượt xem của máy này mà Sheet chưa ghi đủ
function unsentViews() {
  const out = {};
  Object.keys(log.mine).forEach(d => { if (log.mine[d] > (log.synced[d] || 0)) out[d] = log.mine[d]; });
  return out;
}
// Đọc lượt xem lưu trong máy. Lần đầu mở bản app có thống kê thì đặt tên cho máy
function loadLog() {
  const o = load(KEYS.log, null) || {};
  const fresh = typeof o.device !== 'string' || !o.device;
  log = { device: fresh ? newDevice() : o.device, mine: counts(o.mine), synced: counts(o.synced), others: counts(o.others) };
  if (fresh) store(KEYS.log, log);
}
// Bản sửa chưa gửi được thì trả về hàng đợi; ô nào sửa thêm trong lúc chờ thì giữ "from" cũ, "to" mới
function keepEdits(sent) {
  Object.keys(sent).forEach(k => {
    const ed = Object.assign({}, sent[k]);
    Object.keys(edits[k] || {}).forEach(name => {
      ed[name] = { from: sent[k][name] ? sent[k][name].from : edits[k][name].from, to: edits[k][name].to };
    });
    edits[k] = ed;
  });
}
// Áp các bản sửa còn trong máy lên thẻ vừa nhận từ Sheet
function applyEdits() {
  const byKey = new Map(items.map(x => [keyOf(x), x]));
  Object.keys(edits).forEach(k => {
    const it = byKey.get(k);
    if (it) Object.keys(edits[k]).forEach(name => { it[name] = edits[k][name].to; });
  });
}
// Mỗi từ một thẻ: có hai thẻ cùng một từ (Sheet có dòng trùng, hay dữ liệu từ bản app trước) thì giữ thẻ đầu
function dedupe(list) {
  const seen = new Set();
  return list.filter(x => {
    const k = keyOf(x);
    if (!k || seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}
// Bản app trước nhận ra thẻ theo id. Lần đầu mở bản này thì chuyển các thay đổi chưa đồng bộ sang tra theo từ, rồi bỏ id.
// Lệnh xoá một từ mà bộ thẻ vẫn còn thẻ cùng từ lấy từ Sheet (Sheet có hai dòng trùng) thì bỏ, để không xoá nhầm dòng.
// Còn thẻ cùng từ mới thêm trong app (xoá rồi thêm lại) thì giữ: dòng cũ bị xoá, từ mới thành dòng mới.
function migrate() {
  if (!items.some(x => 'id' in x)) return;
  const keyById = new Map(items.map(x => [x.id, keyOf(x)]));
  const rekey = o => {
    const out = dict();
    Object.keys(o).forEach(id => {
      const k = keyById.get(id);
      if (k) out[k] = Object.assign({}, out[k], o[id]);
    });
    return out;
  };
  pending = rekey(pending);
  edits = rekey(edits);
  const kept = dict();
  Object.keys(deletes).forEach(id => {
    const term = deletes[id] && deletes[id].term, k = normTerm(term);
    if (k && !items.some(x => !x.local && keyOf(x) === k)) kept[k] = { term };
  });
  deletes = kept;
  items = dedupe(items);
  items.forEach(x => { delete x.id; });
  persist();
}

/* ---------- Giao diện ---------- */
function renderTop() {
  const left = items.filter(x => !x.mastered).length;
  $stats.innerHTML = demo
    ? 'Thẻ mẫu, bấm ⚙ để kết nối Sheet'
    : `<span><b>${left}</b> đang học,</span> <span><b>${items.length - left}</b> đã nắm rõ</span>`;
  $stats.setAttribute('aria-label', demo ? 'Thẻ mẫu. Kết nối Sheet'
    : `${left} đang học, ${items.length - left} đã nắm rõ. Xem thống kê`);
  const n = unsynced();
  $badge.hidden = n === 0;
  $badge.textContent = n > 99 ? '99+' : String(n);
  $sync.setAttribute('aria-label', n ? `Đồng bộ (${n} thay đổi chưa đồng bộ)` : 'Đồng bộ');
}

function renderCard() {
  const it = current;
  $master.disabled = $next.disabled = !it;
  $hint.style.visibility = it ? '' : 'hidden';
  if (!it) {
    $card.className = 'card';
    $card.innerHTML = `<p class="empty">${items.length
      ? 'Bạn đã nắm rõ hết các thẻ.<br>Bấm + để thêm từ mới.'
      : 'Sheet chưa có từ nào.<br>Bấm + để thêm từ mới.'}</p>`;
    return;
  }
  $card.className = cardClass(it);
  $card.innerHTML = cardHtml(it);
}

// Thẻ ngữ pháp có đường kẻ màu khác
function cardClass(it) {
  return typesOf(it.type).map(kindOf).some(k => k.cls === 'grammar') ? 'card grammar' : 'card';
}
/* Từ đồng nghĩa: mỗi thẻ ghi các từ đồng nghĩa của nó (cột synonyms). Thẻ hiện thêm các thẻ khác ghi nó là từ đồng
   nghĩa, nên chỉ cần ghi ở một bên: inevitable ghi unavoidable thì thẻ unavoidable cũng hiện inevitable, kể cả khi
   unavoidable được thêm sau. */
const synCache = new WeakMap();          // thẻ → các từ đồng nghĩa thẻ tự ghi, dạng khoá; thẻ đổi từ đồng nghĩa thì tính lại
function synKeys(it) {
  let c = synCache.get(it);
  if (!c || c.raw !== it.synonyms) {
    c = { raw: it.synonyms, keys: new Set(synList(it.synonyms).map(normTerm)) };
    synCache.set(it, c);
  }
  return c.keys;
}
// Các thẻ ghi từ k là từ đồng nghĩa
function linkedFrom(k) { return k ? items.filter(x => synKeys(x).has(k)) : []; }
// Từ đồng nghĩa hiện trên thẻ: các từ thẻ tự ghi, rồi tới các thẻ ghi nó là từ đồng nghĩa
function synonymsOf(it) {
  const self = keyOf(it), seen = new Set([self]), out = [];
  const add = t => {
    const k = normTerm(t);
    if (!seen.has(k)) { seen.add(k); out.push(t); }
  };
  synList(it.synonyms).forEach(add);
  linkedFrom(self).forEach(x => add(x.term));
  return out;
}

// Nội dung một thẻ, dùng cho thẻ đang học và thẻ xem trong Tất cả từ
function cardHtml(it) {
  const kinds = typesOf(it.type).map(kindOf);
  // (n) cuộc chạy: phần loại từ ở đầu dòng in nghiêng. Từ đồng nghĩa ngay dưới nghĩa
  const meaning = lines(it.meaning).map(l => rich(l).replace(PREFIX, '<i>$&</i>')).join('<br>');
  const syn = synonymsOf(it);
  const gist = (meaning ? `<p class="meaning">${meaning}</p>` : '')
    + (syn.length ? `<p class="syn"><i>syn.</i> ${esc(syn.join(', '))}</p>` : '');
  const examples = lines(it.example)
    .map((l, i) => `<p class="ex">${i === 0 ? '<i>e.g.</i> ' : ''}${rich(l)}</p>`)
    .join('');
  const seen = validDate(it.lastSeen)
    ? `${fmtDate(it.lastSeen)} (${agoText(daysAgo(it.lastSeen))})`
    : 'chưa xem';
  const edit = demo ? '' : '<button class="edit" type="button" aria-label="Sửa thẻ này"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>';
  const phon = it.phonetic ? `<p class="phon">${esc(it.phonetic)}</p>` : '';
  return `
    <div class="head"><h1 class="term">${esc(it.term)}</h1>${phon}</div>
    <div class="body">${gist ? `<div class="gist">${gist}</div>` : ''}${examples}</div>
    <div class="foot"><span>${esc(kinds.map(k => k.label).join(', '))}</span><span class="seen">last seen: ${seen}</span>${edit}</div>`;
}

function show(it) { current = it; renderCard(); }
function next() { show(pickNext(items, current)); }

// Thẻ cũ bay ra (dir: -1 trái, 1 phải, 0 lên trên), thẻ mới trồi lên từ chồng thẻ
function leave(dir, after) {
  busy = true;
  $card.style.transition = '';
  $card.style.transform = dir === 0
    ? 'translateY(-40px) scale(.96)'
    : `translateX(${dir * (window.innerWidth + 60)}px) rotate(${dir * 12}deg)`;
  $card.style.opacity = '0';
  setTimeout(() => {
    after();
    $card.style.transition = 'none';
    $card.style.transform = 'translateY(14px) scale(.98)';
    void $card.offsetWidth;
    $card.style.transition = '';
    $card.style.transform = '';
    $card.style.opacity = '';
    busy = false;                        // thẻ mới vừa hiện là kéo tiếp được, không phải đợi nó trồi lên xong
  }, 200);
}

// Vuốt: ghi lại lúc vừa xem thẻ này, rồi sang thẻ khác
function swipe(dir) {
  if (busy || !current) return;
  const it = current;
  leave(dir, () => {
    recordChange(it, { lastSeen: new Date().toISOString() });
    next();
  });
}

function master() {
  if (busy || !current) return;
  const it = current;
  recordChange(it, { mastered: true, lastSeen: new Date().toISOString() });
  leave(0, next);
  toast(`Đã nắm rõ “${it.term}”`, 'Hoàn tác', function undo() {
    if (busy) { setTimeout(undo, 120); return; }
    recordChange(it, { mastered: false });
    show(it);
  });
}

/* ---------- Kéo thẻ ---------- */
function onDown(e) {
  if (busy || !current || (e.pointerType === 'mouse' && e.button !== 0)) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, t: e.timeStamp, dx: 0, v: 0, on: false };
}
function onMove(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.on) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
    drag.on = true;
    drag.x += Math.sign(dx) * 10;        // bỏ phần ngưỡng 10px, để thẻ không giật một phát lúc bắt đầu chạy
    try { $card.setPointerCapture(e.pointerId); } catch (_) {}
    $card.style.transition = 'none';
  }
  const dx = e.clientX - drag.x, dt = e.timeStamp - drag.t;
  if (dt > 0) drag.v = 0.8 * (dx - drag.dx) / dt + 0.2 * drag.v;   // vận tốc (px/ms), làm mượt cho đỡ nhiễu
  drag.dx = dx;
  drag.t = e.timeStamp;
  $card.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
}
function onUp(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const { on, dx } = drag;
  const v = e.timeStamp - drag.t < 50 ? drag.v : 0;       // dừng tay rồi mới thả thì không tính là hất
  drag = null;
  if (!on) return;
  $card.style.transition = '';
  // Đổi thẻ khi kéo đủ xa, hoặc khi hất nhanh theo đúng chiều đang kéo dù quãng ngắn
  const far = Math.abs(dx) > Math.min(100, $card.offsetWidth * 0.25);
  const flick = Math.abs(v) > 0.4 && Math.abs(dx) > 25 && v * dx > 0;
  if (e.type === 'pointerup' && (far || flick)) swipe(dx > 0 ? 1 : -1);
  else $card.style.transform = '';
}

/* ---------- Thông báo ---------- */
// Bảng đang mở trên cùng: bảng xoá nằm trên bảng sửa, bảng sửa trên bảng xem từ, xem từ trên Tất cả từ
function topDialog() { return [$del, $add, $view, $lib, $dlg].find(d => d.open) || null; }
function toast(msg, actionLabel, action) {
  // Đang mở bảng thì đặt thông báo vào bảng trên cùng, không thì bảng che mất
  const host = topDialog() || document.body;
  if ($toast.parentNode !== host) host.appendChild($toast);
  $toastMsg.textContent = msg;
  $toastAct.hidden = !actionLabel;
  $toastAct.textContent = actionLabel || '';
  $toastAct.onclick = actionLabel ? () => { hideToast(); action(); } : null;
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 5000 : msg.length > 60 ? 6000 : 3500);
}
function hideToast() { $toast.classList.remove('show'); }

/* ---------- Thêm và sửa từ ----------
   Mỗi từ một thẻ: gõ một từ đã có thì bảng chuyển sang sửa thẻ đó, không thêm thẻ trùng.
   Từ mới và bản sửa vào máy ngay, kể cả lúc không có mạng; lần đồng bộ sau mới ghi vào Sheet. */
function findWord(term) {
  const k = normTerm(term);
  return demo || !k ? null : items.find(x => keyOf(x) === k) || null;
}
/* Loại từ do người dùng tự tạo. Gợi ý gồm các loại ở tab types của Sheet và các loại đang dùng ở các thẻ,
   loại dùng nhiều đứng trước. Loại mới chỉ được lưu khi từ mang nó được lưu. */
function knownTypes() {
  const seen = new Map();                // normTerm(loại) → { type, uses, order }
  const add = (t, uses) => {
    const k = normTerm(t);
    if (!seen.has(k)) seen.set(k, { type: typeName(t), uses: 0, order: seen.size });
    seen.get(k).uses += uses;
  };
  types.forEach(x => add(x.type, 0));
  if (!demo) items.forEach(it => typesOf(it.type).forEach(t => add(t, 1)));
  return Array.from(seen.values()).sort((a, b) => b.uses - a.uses || a.order - b.order).map(x => x.type);
}
function checkedTypes() { return picked.slice(); }
// Chọn đúng các loại trong list, không đụng tới ô Nghĩa
function setTypes(list) {
  picked = [];
  list.forEach(t => { if (!picked.some(x => normTerm(x) === normTerm(t))) picked.push(typeName(t)); });
  renderTypes();
}
// Hai danh sách (loại từ, từ đồng nghĩa) có cùng các mục, không kể thứ tự và hoa thường
function sameSet(a, b) {
  const x = new Set(a.map(normTerm)), y = new Set(b.map(normTerm));
  return x.size === y.size && Array.from(y).every(t => x.has(t));
}
// Viết tắt đặt trước nghĩa: cột abbr ở tab types; bỏ trống thì viết tắt quen thuộc, không có nữa thì nguyên tên
function abbr(type) {
  const k = normTerm(type);
  const t = types.find(x => normTerm(x.type) === k);
  return (t && t.abbr) || ABBR[k] || typeName(type);
}
// Vẽ các mục đã chọn (loại từ, từ đồng nghĩa) thành thẻ nhỏ trong ô, ngay trước chỗ gõ
function drawTags(box, input, list, label) {
  box.querySelectorAll('.tag').forEach(el => el.remove());
  list.forEach(t => {
    const el = document.createElement('span');
    el.className = 'tag';
    el.dataset.value = t;
    el.innerHTML = `<span>${esc(t)}</span><button type="button" aria-label="${label} ${esc(t)}">×</button>`;
    box.insertBefore(el, input);
  });
}
// Nút gợi ý bên dưới ô. Có label là nút thêm mục mới, viền nét đứt
function chip(value, label) {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.value = value;
  b.textContent = label || value;
  if (label) b.className = 'new';
  return b;
}
// Ô chọn nhiều mục (loại từ, từ đồng nghĩa): chạm gợi ý để chọn, chạm × để bỏ, chạm vào ô để gõ. Gõ dấu phẩy là xong
// một mục; ô đang trống mà bấm xoá lùi thì bỏ mục cuối cùng. Nhấn giữ trên nút không lấy focus khỏi ô đang gõ, để bàn
// phím điện thoại không bị đóng rồi mở lại
function tagField(box, input, sugg, pick, unpick, chosen, refresh) {
  sugg.addEventListener('mousedown', e => e.preventDefault());
  sugg.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const keyboard = document.activeElement === b;      // chọn bằng Tab rồi Enter: trả focus về ô gõ
    pick(b.dataset.value);
    if (keyboard) input.focus();
  });
  box.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  box.addEventListener('click', e => {
    const x = e.target.closest('.tag button');
    if (!x) { input.focus(); return; }
    const keyboard = document.activeElement === x;
    unpick(x.parentNode.dataset.value);
    if (keyboard) input.focus();
  });
  input.addEventListener('input', () => {
    if (input.value.includes(',')) {
      const parts = input.value.split(',');
      const rest = parts.pop();
      parts.forEach(t => pick(t));
      input.value = rest.replace(/^\s+/, '');
    }
    refresh();
    checkAdd();
  });
  input.addEventListener('keydown', e => {
    const list = chosen();
    if (e.key === 'Backspace' && !input.value && list.length && !e.isComposing) unpick(list[list.length - 1]);
  });
}
// Vẽ lại các loại đã chọn trong ô, và hàng gợi ý bên dưới
function renderTypes() {
  drawTags($tags, $typeIn, picked, 'Bỏ loại');
  $typeIn.placeholder = picked.length ? '' : 'Gõ để tìm hoặc thêm loại';
  renderSugg();
}
// Chưa gõ gì: gợi ý mọi loại chưa chọn. Đang gõ: chỉ các loại có chữ vừa gõ (khớp từ đầu thì đứng trước),
// cộng nút tạo loại mới nếu chưa loại nào trùng tên
function renderSugg() {
  const q = typeName($typeIn.value), k = normTerm(q);
  const chosen = new Set(picked.map(normTerm));
  const known = knownTypes();
  let list = known.filter(t => !chosen.has(normTerm(t)));
  if (k) {
    list = list.filter(t => normTerm(t).includes(k))
      .sort((a, b) => normTerm(b).startsWith(k) - normTerm(a).startsWith(k));
  }
  const chips = list.map(t => chip(t));
  if (k && !chosen.has(k) && !known.some(t => normTerm(t) === k)) chips.push(chip(q, `+ Thêm “${q}”`));
  $sugg.replaceChildren(...chips);
}
// Chọn một loại: loại đã có thì giữ đúng cách viết đã có, chưa có thì thành loại mới.
// Mỗi loại một dòng nghĩa mở đầu bằng (n), (v)…, kể cả khi chỉ chọn một loại. Nghĩa chưa ghi loại nào là của loại chọn đầu tiên.
function pickType(name) {
  const t = typeName(name);
  $typeIn.value = '';
  if (t && !picked.some(x => normTerm(x) === normTerm(t))) {
    picked.push(knownTypes().find(x => normTerm(x) === normTerm(t)) || t);
    let ls = lines($meaning.value);
    if (ls.length && !ls.some(l => PREFIX.test(l))) {
      const first = abbr(picked[0]);
      ls = ls.map(l => `(${first}) ${l}`);
    }
    picked.forEach(x => {
      const tag = `(${abbr(x)})`;
      if (!ls.some(l => l.startsWith(tag))) ls.push(tag);
    });
    // dòng mới chỉ có (v) thì chừa sẵn dấu cách để gõ nghĩa tiếp
    $meaning.value = ls.map(l => l.replace(PREFIX, '').trim() ? l : l + ' ').join('\n');
  }
  renderTypes();
  checkAdd();
}
// Bỏ một loại: xoá dòng nghĩa của loại đó nếu dòng còn trống. Bỏ loại duy nhất còn lại thì gỡ luôn (n) ở các dòng
// đã ghi nghĩa, giữ phần nghĩa, để chọn loại khác thay vào là thành (v) cuộc chạy
function unpickType(name) {
  const t = picked.find(x => normTerm(x) === normTerm(name));
  if (!t) return;
  picked = picked.filter(x => x !== t);
  const tag = `(${abbr(t)})`;
  let ls = $meaning.value.split('\n').filter(l => l.trim() !== tag);
  if (!picked.length) ls = ls.map(l => l.trim().startsWith(tag) ? l.trim().slice(tag.length).trim() : l);
  $meaning.value = ls.join('\n');
  renderTypes();
  checkAdd();
}
// Nghĩa để lưu: bỏ dòng trống và dòng chỉ có (v) mà chưa ghi nghĩa
function cleanMeaning(v) { return lines(v).filter(l => l.replace(PREFIX, '').trim()).join('\n'); }
// Các dòng của a, thêm những dòng của b mà a chưa có
function mergeLines(a, b) {
  const ls = lines(a);
  lines(b).forEach(l => { if (!ls.includes(l)) ls.push(l); });
  return ls.join('\n');
}

// Đặt các từ đồng nghĩa trong ô: bỏ từ trùng, và bỏ chính từ đang thêm hay sửa
function setSyns(list) {
  const self = normTerm($term.value);
  syns = [];
  list.forEach(t => {
    const k = normTerm(t);
    if (k && k !== self && !syns.some(s => normTerm(s) === k)) syns.push(typeName(t));
  });
  renderSyns();
}
function renderSyns() {
  drawTags($synTags, $synIn, syns, 'Bỏ từ đồng nghĩa');
  $synIn.placeholder = syns.length ? '' : 'Gõ để tìm hoặc thêm từ';
  renderSynSugg();
}
// Đang gõ: gợi ý tối đa 6 từ trong bộ thẻ có chữ vừa gõ (khớp từ đầu thì đứng trước), cộng nút thêm đúng chữ đã gõ
// nếu bộ thẻ chưa có từ đó
function renderSynSugg() {
  const q = typeName($synIn.value), k = normTerm(q), f = fold(q);
  const skip = new Set(syns.map(normTerm).concat(normTerm($term.value)));
  const chips = [];
  if (k && !demo) {
    const t = x => searchKeys(x).t;
    items.filter(x => t(x).includes(f) && !skip.has(keyOf(x)))
      .sort((a, b) => t(b).startsWith(f) - t(a).startsWith(f) || (t(a) < t(b) ? -1 : t(a) > t(b) ? 1 : 0))
      .slice(0, 6)
      .forEach(x => chips.push(chip(x.term)));
  }
  if (k && !skip.has(k) && !findWord(q)) chips.push(chip(q, `+ Thêm “${q}”`));
  $synSugg.replaceChildren(...chips);
}
// Thêm từ đồng nghĩa (gõ "a; b" thì thêm cả hai). Từ có trong bộ thẻ thì giữ đúng cách viết của thẻ
function pickSyn(text) {
  $synIn.value = '';
  const add = synList(text).map(t => (findWord(t) || { term: t }).term);
  add.forEach(t => synDropped.delete(normTerm(t)));
  setSyns(syns.concat(add));
  checkAdd();
}
function unpickSyn(name) {
  const k = normTerm(name);
  synDropped.add(k);
  setSyns(syns.filter(s => normTerm(s) !== k));
  checkAdd();
}
// Thêm từ mới mà các thẻ khác đã ghi là từ đồng nghĩa: điền sẵn các thẻ đó vào ô, trừ thẻ bạn vừa bỏ ra.
// Gõ sang từ khác thì bỏ những từ đã tự điền
function autoSyns() {
  const k = demo ? '' : normTerm($term.value);
  if (k === synAuto.key) return;
  dropAutoSyns();
  const have = new Set(syns.map(normTerm));
  const add = linkedFrom(k).map(x => x.term).filter(t => !have.has(normTerm(t)) && !synDropped.has(normTerm(t)));
  if (add.length) setSyns(syns.concat(add));
  synAuto = { key: k, keys: add.map(normTerm) };
}
function dropAutoSyns() {
  const auto = new Set(synAuto.keys);
  if (auto.size) setSyns(syns.filter(s => !auto.has(normTerm(s))));
  synAuto = { key: '', keys: [] };
}

function formState() {
  return { phonetic: $phonetic.value, types: checkedTypes(), meaning: $meaning.value, example: $example.value,
    syns: syns.slice() };
}
// Những ô trong bảng khác với thẻ. Từ đồng nghĩa so với những từ thẻ đang hiện, kể cả từ do thẻ khác ghi
function formDiff(it) {
  const diff = {};
  const phonetic = $phonetic.value.trim();
  const meaning = cleanMeaning($meaning.value), example = lines($example.value).join('\n');
  if (phonetic !== (it.phonetic || '')) diff.phonetic = phonetic;
  if (meaning !== lines(it.meaning).join('\n')) diff.meaning = meaning;
  if (example !== lines(it.example).join('\n')) diff.example = example;
  if (!sameSet(checkedTypes(), typesOf(it.type))) diff.type = checkedTypes().join(', ');
  if (!sameSet(syns, synonymsOf(it))) diff.synonyms = syns.join(', ');
  return diff;
}
// Cần có từ. Đang sửa thì cần có ô khác thẻ, hoặc chữ gõ dở trong ô Loại từ hay Từ đồng nghĩa mà thẻ chưa có
// (bấm lưu là chữ đó được thêm vào)
function checkAdd() {
  const typed = normTerm($typeIn.value), syn = normTerm($synIn.value);
  const newType = !!typed && !picked.some(x => normTerm(x) === typed);
  const newSyn = !!syn && syn !== normTerm($term.value) && !syns.some(x => normTerm(x) === syn);
  $addSave.disabled = !$term.value.trim()
    || (!!editing && !Object.keys(formDiff(editing)).length && !newType && !newSyn);
}

// Gõ ra một từ đã có: chuyển sang sửa thẻ đó. Loại, từ đồng nghĩa đã chọn và chữ đã gõ ở Nghĩa, Ví dụ được ghép vào
// thẻ; phiên âm đã gõ thì thay cho phiên âm của thẻ
function startEdit(it) {
  before = formState();
  setTypes(typesOf(it.type).concat(before.types));
  $phonetic.value = before.phonetic.trim() || it.phonetic || '';
  $meaning.value = mergeLines(it.meaning, before.meaning);
  $example.value = mergeLines(it.example, before.example);
  setSyns(synonymsOf(it).concat(before.syns));
  editing = it;
  filled = formState();
  $addTitle.textContent = 'Sửa từ';
  $addSave.textContent = 'Cập nhật';
  $addMsg.textContent = `“${it.term}” đã có trong bộ thẻ, bạn đang sửa thẻ này.${it.mastered ? ' Thẻ này đã nắm rõ.' : ''}`;
  $addMsg.hidden = false;
  $addDel.hidden = false;
}
// Thôi sửa. restore: ô nào chưa sửa từ lúc nạp thì trả về như trước khi nạp
function stopEdit(restore) {
  if (restore) {
    const now = formState();
    if (now.phonetic === filled.phonetic) $phonetic.value = before.phonetic;
    if (now.meaning === filled.meaning) $meaning.value = before.meaning;
    if (now.example === filled.example) $example.value = before.example;
    if (sameSet(now.types, filled.types)) setTypes(before.types);
    if (sameSet(now.syns, filled.syns)) setSyns(before.syns);
  }
  editing = before = filled = null;
  $addTitle.textContent = 'Thêm từ mới';
  $addSave.textContent = 'Thêm';
  $addMsg.hidden = true;
  $addDel.hidden = true;
}
function resetForm() {
  clearTimeout(lookupTimer);
  if (editing) stopEdit(false);
  $term.value = $phonetic.value = $typeIn.value = $meaning.value = $example.value = $synIn.value = '';
  setTypes([]);
  synAuto = { key: '', keys: [] };
  synDropped = new Set();
  setSyns([]);
}
// Tra xem từ trong ô Từ đã có trong bộ thẻ chưa. Từ mới thì điền sẵn các thẻ đã ghi nó là từ đồng nghĩa
function lookup() {
  clearTimeout(lookupTimer);
  const found = findWord($term.value);
  if (found !== editing) {
    if (editing) stopEdit(true);
    if (found) {
      dropAutoSyns();
      startEdit(found);
    }
  }
  if (!editing) autoSyns();
  checkAdd();
}
function openAdd(it) {
  if (it) {                              // nút ✎: mở bảng sửa cho thẻ đang xem
    resetForm();
    $term.value = it.term;
    startEdit(it);
  } else {
    lookup();                            // bản nháp còn lại có thể trùng từ vừa đồng bộ về
  }
  renderSugg();                          // loại từ và các từ trong bộ thẻ có thể vừa đổi sau lần đồng bộ
  renderSynSugg();
  checkAdd();
  if (!$add.open) $add.showModal();
}
function saveWord() {
  if (typeName($typeIn.value)) pickType($typeIn.value);  // loại gõ dở mà chưa bấm Enter cũng được tính
  if (typeName($synIn.value)) pickSyn($synIn.value);     // từ đồng nghĩa gõ dở cũng vậy
  if (!editing) {
    lookup();
    if (editing) return;                 // vừa nhận ra từ đã có: để bạn xem nội dung cũ rồi mới bấm Cập nhật
  }
  if ($addSave.disabled) { if (!$term.value.trim()) $term.focus(); return; }
  if (editing) updateWord(); else addWord();
}
function addWord() {
  const term = $term.value.trim();
  const it = {
    term, phonetic: $phonetic.value.trim(), type: checkedTypes().join(', '), meaning: cleanMeaning($meaning.value),
    example: lines($example.value).join('\n'), synonyms: syns.join(', '),
    added: new Date().toISOString(), lastSeen: '', mastered: false, local: true
  };
  if (demo) { items = []; demo = false; }  // từ đầu tiên của bạn thay cho thẻ mẫu
  unlinkSyns(term);
  items.push(it);
  saved(it, `Đã thêm “${term}”. Bấm ↻ để gửi lên Sheet.`);
}
function updateWord() {
  const it = editing;
  editCard(it, formDiff(it));
  unlinkSyns(it.term);
  saved(it, `Đã sửa “${it.term}”. Bấm ↻ để gửi lên Sheet.`);
}
// Sửa thẻ trong máy ngay, và ghi lại bản sửa để gửi lên Sheet.
// Sửa nhiều lần trước khi đồng bộ thì giữ "from" của lần đầu; sửa về như cũ thì bỏ.
function editCard(it, diff) {
  const k = keyOf(it), ed = edits[k] || {};
  Object.keys(diff).forEach(name => {
    const from = ed[name] ? ed[name].from : it[name];
    if (from === diff[name]) delete ed[name]; else ed[name] = { from, to: diff[name] };
  });
  if (Object.keys(ed).length) edits[k] = ed; else delete edits[k];
  Object.assign(it, diff);
}
// Bỏ khỏi ô một từ đồng nghĩa mà thẻ kia đã ghi (thẻ kia ghi từ này là từ đồng nghĩa) thì sửa luôn thẻ kia,
// không thì hai thẻ vẫn hiện nhau
function unlinkSyns(term) {
  const k = normTerm(term), keep = new Set(syns.map(normTerm));
  linkedFrom(k).forEach(x => {
    const xk = keyOf(x);
    if (!synDropped.has(xk) || keep.has(xk)) return;
    editCard(x, { synonyms: synList(x.synonyms).filter(s => normTerm(s) !== k).join(', ') });
  });
}
function saved(it, msg) {
  resetForm();
  $add.close();
  // Sửa từ trong Tất cả từ thì thẻ đang học giữ nguyên, chỉ vẽ lại phòng khi đó chính là từ vừa sửa
  if ($lib.open) { renderCard(); refreshLib(); } else show(it);
  renderTop();
  if (persist()) toast(msg);
}

// Xoá từ đang sửa: hỏi lại trước khi xoá
function askDelete() {
  const it = editing;
  if (!it) return;
  $delTitle.textContent = `Xoá “${it.term}”?`;
  $delText.textContent = it.local && !it.tried
    ? 'Từ này chưa lên Sheet, xoá rồi là mất hẳn.'
    : 'Thẻ sẽ mất khỏi bộ thẻ, và dòng của từ này trong Sheet bị xoá ở lần đồng bộ kế tiếp.';
  $del.showModal();
}
function deleteWord() {
  const it = editing;
  $del.close();
  if (!it) return;
  const k = keyOf(it);
  items = items.filter(x => x !== it);
  delete pending[k];
  delete edits[k];
  // Từ chưa từng gửi lên Sheet thì không cần báo script. Còn lại thì xoá dòng trong Sheet ở lần đồng bộ sau.
  // Xoá rồi thêm lại đúng từ đó trước khi đồng bộ thì lệnh xoá vẫn giữ: dòng cũ bị xoá, từ mới thành dòng mới
  const inSheet = !it.local || it.tried || syncing;
  if (inSheet) deletes[k] = { term: it.term };
  resetForm();
  $add.close();
  if (current === it) next(); else renderCard();
  renderTop();
  refreshLib();
  if (persist()) toast(inSheet ? `Đã xoá “${it.term}”. Bấm ↻ để xoá trong Sheet.` : `Đã xoá “${it.term}”.`);
}

/* ---------- Tất cả từ ----------
   Xem lại mọi từ, kể cả từ đã nắm rõ. Xem ở đây không ghi last seen và không tính lượt xem.
   Danh sách vẽ dần từng đoạn khi cuộn tới, nên bộ thẻ vài nghìn từ vẫn mở nhanh. */
const CHUNK = 100;
const folded = new WeakMap();            // thẻ → chữ đã bỏ dấu để tìm; thẻ đổi chữ thì tính lại
function searchKeys(it) {
  let k = folded.get(it);
  if (!k || k.term !== it.term || k.meaning !== it.meaning) {
    k = { term: it.term, meaning: it.meaning, t: fold(it.term), m: fold(String(it.meaning).replace(/\*/g, '')) };
    folded.set(it, k);
  }
  return k;
}
function openLib(tab) {
  statSel = -1;
  showTab(tab);
  $statsBox.scrollTop = 0;               // mở lại thì thống kê bắt đầu từ trên cùng
  if (!$lib.open) $lib.showModal();
}
function showTab(tab) {
  const words = tab === 'words';
  $tabWords.setAttribute('aria-selected', String(words));
  $tabStats.setAttribute('aria-selected', String(!words));
  $tabWords.tabIndex = words ? 0 : -1;
  $tabStats.tabIndex = words ? -1 : 0;
  $paneWords.hidden = !words;
  $paneStats.hidden = words;
  if (words) renderWords(); else renderStats();
}
// Bộ thẻ vừa đổi (sửa, xoá, đồng bộ xong) trong lúc đang mở bảng: vẽ lại, giữ chỗ đang cuộn
function refreshLib() {
  if (!$lib.open) return;
  if ($paneWords.hidden) renderStats(); else renderWords(true);
  if ($view.open) renderView();
}
function renderWords(keep) {
  const q = fold($find.value);
  const rank = new Map();                // khớp ở đâu: 0 từ bắt đầu bằng chữ tìm, 1 từ có chữ đó, 2 nghĩa có chữ đó
  let list = items;
  if (q) {
    list = items.filter(it => {
      const k = searchKeys(it);
      const r = k.t.startsWith(q) ? 0 : k.t.includes(q) ? 1 : k.m.includes(q) ? 2 : -1;
      if (r !== -1) rank.set(it, r);
      return r !== -1;
    });
  }
  const done = list.filter(x => x.mastered).length;
  const n = { all: list.length, learn: list.length - done, done };
  $filt.querySelectorAll('button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.f === libFilter));
    b.querySelector('small').textContent = NUM.format(n[b.dataset.f]);
  });
  if (libFilter !== 'all') list = list.filter(x => x.mastered === (libFilter === 'done'));
  // Mới thêm: theo ngày thêm, mới trước; từ chưa có ngày thêm thì dòng dưới trong Sheet đứng trước.
  // Lâu chưa xem: thẻ chưa xem trước, rồi tới thẻ xem lâu nhất. Tính sẵn khoá để xếp vài nghìn từ vẫn nhanh
  const pos = new Map(items.map((x, i) => [x, i]));
  const key = new Map(list.map(x => [x, libSort === 'az' ? searchKeys(x).t
    : Date.parse(libSort === 'new' ? x.added : x.lastSeen) || 0]));
  const by = {
    new: (a, b) => key.get(b) - key.get(a) || pos.get(b) - pos.get(a),
    az: (a, b) => (key.get(a) < key.get(b) ? -1 : key.get(a) > key.get(b) ? 1 : pos.get(a) - pos.get(b)),
    old: (a, b) => key.get(a) - key.get(b) || pos.get(a) - pos.get(b)
  }[libSort];
  libList = list.slice().sort((a, b) => (rank.get(a) || 0) - (rank.get(b) || 0) || by(a, b));
  const top = $wordsBox.scrollTop, shown = libShown;
  libShown = 0;
  $words.textContent = '';
  moreWords(keep ? shown : 0);
  $wordsBox.scrollTop = keep ? top : 0;
  $wordsNone.hidden = libList.length > 0;
  $wordsNone.textContent = !items.length ? 'Chưa có từ nào.'
    : q ? `Không có từ nào khớp “${$find.value.trim()}”.`
    : libFilter === 'done' ? 'Chưa có từ nào đã nắm rõ.' : 'Bạn đã nắm rõ hết các từ.';
}
// Vẽ thêm một đoạn danh sách, hoặc vẽ cho tới dòng thứ upTo
function moreWords(upTo) {
  const end = Math.min(libList.length, Math.max(libShown + CHUNK, upTo || 0));
  if (end <= libShown) return;
  const now = Date.now();
  $words.insertAdjacentHTML('beforeend',
    libList.slice(libShown, end).map((it, k) => rowHtml(it, libShown + k, now)).join(''));
  libShown = end;
}
function rowHtml(it, i, now) {
  const meaning = lines(it.meaning).join(' · ').replace(/\*/g, '');
  const seen = validDate(it.lastSeen) ? `xem ${agoText(daysAgo(it.lastSeen, now))}` : 'chưa xem';
  return `<li><button class="row" type="button" data-i="${i}">`
    + `<span class="rt"><b>${esc(it.term)}</b>${it.phonetic ? ` <span>${esc(it.phonetic)}</span>` : ''}</span>`
    + (meaning ? `<span class="rm">${esc(meaning)}</span>` : '')
    + `<span class="rs">${seen}${it.mastered ? '<br><em>đã nắm rõ</em>' : ''}</span></button></li>`;
}

/* ---------- Xem một từ ----------
   Bấm một dòng trong Tất cả từ: hiện thẻ như lúc học, đi qua các từ theo thứ tự của danh sách lúc bấm vào.
   Không ghi last seen. */
function openView(i) {
  viewKeys = libList.map(keyOf);
  viewAt = i;
  renderView();
  if (!$view.open) $view.showModal();
}
function viewItem() {
  const k = viewKeys[viewAt];
  return items.find(x => keyOf(x) === k) || null;
}
function renderView() {
  const byKey = new Map(items.map(x => [keyOf(x), x]));
  const cur = viewKeys[viewAt];
  viewKeys = viewKeys.filter(k => byKey.has(k));    // bỏ từ vừa bị xoá, trong app hay trong Sheet
  const at = viewKeys.indexOf(cur);
  viewAt = Math.max(0, Math.min(at !== -1 ? at : viewAt, viewKeys.length - 1));
  const it = byKey.get(viewKeys[viewAt]);
  if (!it) { $view.close(); return; }
  $viewCard.className = cardClass(it);
  $viewCard.innerHTML = cardHtml(it);
  $viewPos.textContent = `${NUM.format(viewAt + 1)} / ${NUM.format(viewKeys.length)}`;
  $viewHint.textContent = (validDate(it.added) ? `Thêm ngày ${fmtDate(it.added)}` : 'Chưa rõ ngày thêm')
    + (it.mastered ? ' · đã nắm rõ' : '');
  $prev.disabled = viewAt === 0;
  $nextWord.disabled = viewAt >= viewKeys.length - 1;
}
// Sang từ trước (dir -1) hay từ sau (1): thẻ cũ trượt ra, thẻ mới trượt vào từ phía bên kia
function viewStep(dir) {
  const to = viewAt + dir;
  if (viewBusy || to < 0 || to >= viewKeys.length) return;
  viewBusy = true;
  $viewCard.style.transition = '';
  $viewCard.style.transform = `translateX(${-dir * (window.innerWidth + 60)}px)`;
  $viewCard.style.opacity = '0';
  setTimeout(() => {
    viewAt = to;
    renderView();
    $viewCard.style.transition = 'none';
    $viewCard.style.transform = `translateX(${dir * 40}px)`;
    void $viewCard.offsetWidth;
    $viewCard.style.transition = '';
    $viewCard.style.transform = '';
    $viewCard.style.opacity = '';
    viewBusy = false;
  }, 200);
}
// Vuốt thẻ: sang trái là từ sau, sang phải là từ trước
function onViewDown(e) {
  if (viewBusy || (e.pointerType === 'mouse' && e.button !== 0)) return;
  vdrag = { id: e.pointerId, x: e.clientX, y: e.clientY, on: false };
}
function onViewMove(e) {
  if (!vdrag || e.pointerId !== vdrag.id) return;
  if (!vdrag.on) {
    const dx = e.clientX - vdrag.x, dy = e.clientY - vdrag.y;
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
    vdrag.on = true;
    vdrag.x += Math.sign(dx) * 10;
    try { $viewCard.setPointerCapture(e.pointerId); } catch (_) {}
    $viewCard.style.transition = 'none';
  }
  $viewCard.style.transform = `translateX(${e.clientX - vdrag.x}px)`;
}
function onViewUp(e) {
  if (!vdrag || e.pointerId !== vdrag.id) return;
  const on = vdrag.on, dx = e.clientX - vdrag.x;
  vdrag = null;
  if (!on) return;
  const dir = dx < 0 ? 1 : -1;
  const to = viewAt + dir;
  if (e.type === 'pointerup' && Math.abs(dx) > Math.min(80, $viewCard.offsetWidth * 0.2)
    && to >= 0 && to < viewKeys.length) {
    viewStep(dir);
  } else {
    $viewCard.style.transition = '';
    $viewCard.style.transform = '';
  }
}

/* ---------- Thống kê ----------
   Từ mới: đếm theo ngày thêm của từng từ còn trong bộ thẻ. Lượt xem: mỗi lần ghi last seen lúc học, cộng cả các máy
   khác dùng chung Sheet. Một biểu đồ cột cho mỗi chỉ số; chạm một cột để xem số của khoảng đó. */
const SPAN = { day: 14, week: 12, month: 12 };            // số cột của biểu đồ
const UNIT = { day: 'ngày', week: 'tuần', month: 'tháng' };
const WEEKDAY = ['Chủ nhật', 'thứ Hai', 'thứ Ba', 'thứ Tư', 'thứ Năm', 'thứ Sáu', 'thứ Bảy'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
// Ngày đầu của n khoảng (ngày, tuần tính từ thứ Hai, tháng), cũ trước, khoảng cuối chứa hôm nay.
// Thêm một mốc là ngày đầu của khoảng kế tiếp, để biết khoảng cuối hết ở đâu
function periods(unit, n, now) {
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const monday = d - (now.getDay() + 6) % 7;
  const at = unit === 'month' ? i => new Date(y, m - i, 1)
    : unit === 'week' ? i => new Date(y, m, monday - 7 * i)
    : i => new Date(y, m, d - i);
  const out = [];
  for (let i = n - 1; i >= -1; i--) out.push(at(i));
  return out;
}
// Cộng số theo ngày vào từng khoảng
function sums(byDay, bounds) {
  const keys = bounds.map(dayKey);
  const out = keys.slice(1).map(() => 0);
  Object.keys(byDay).forEach(k => {
    if (k < keys[0] || k >= keys[keys.length - 1]) return;
    let i = out.length - 1;
    while (k < keys[i]) i--;
    out[i] += byDay[k];
  });
  return out;
}
function addedByDay() {
  const out = {};
  items.forEach(it => {
    if (!validDate(it.added)) return;
    const k = dayKey(new Date(it.added));
    out[k] = (out[k] || 0) + 1;
  });
  return out;
}
// Lượt xem mỗi ngày: các máy khác cộng với máy này. Sheet có thể chưa ghi kịp số mới nhất của máy này nên lấy số lớn hơn
function viewsByDay() {
  const out = Object.assign({}, log.others);
  const own = Object.assign({}, log.synced);
  Object.keys(log.mine).forEach(k => { own[k] = Math.max(own[k] || 0, log.mine[k]); });
  Object.keys(own).forEach(k => { out[k] = (out[k] || 0) + own[k]; });
  return out;
}
function periodName(unit, s, i, n) {
  const dm = x => `${x.getDate()}/${x.getMonth() + 1}`;
  const last = i === n - 1, prev = i === n - 2;
  if (unit === 'day') return last ? 'hôm nay' : prev ? 'hôm qua' : `${WEEKDAY[s.getDay()]} ${dm(s)}`;
  if (unit === 'week') {
    return last ? 'tuần này' : prev ? 'tuần trước'
      : `tuần ${dm(s)} – ${dm(new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6))}`;
  }
  return last ? 'tháng này' : prev ? 'tháng trước' : `tháng ${s.getMonth() + 1}/${s.getFullYear()}`;
}
// Nhãn dưới cột: ngày trong tháng, ngày đầu tuần (cách hai cột ghi một), hay tháng
function tickName(unit, s, i, n) {
  if (unit === 'day') return String(s.getDate());
  if (unit === 'week') return (n - 1 - i) % 3 ? '' : `${s.getDate()}/${s.getMonth() + 1}`;
  return `T${s.getMonth() + 1}`;
}
// Vạch chia trục dọc: số tròn, nhiều nhất 4 khoảng
function ticks(max) {
  for (let p = 1; ; p *= 10) {
    for (const s of [1, 2, 5]) {
      const step = s * p, k = Math.ceil(Math.max(max, 1) / step);
      if (k <= 4) return Array.from({ length: k + 1 }, (_, i) => i * step);
    }
  }
}
function renderStats() {
  const n = SPAN[statUnit], unit = UNIT[statUnit];
  const bounds = periods(statUnit, n, new Date());
  const starts = bounds.slice(0, n);
  const names = starts.map((s, i) => periodName(statUnit, s, i, n));
  const sel = statSel >= 0 && statSel < n ? statSel : n - 1;
  $units.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.u === statUnit)));
  const metrics = [
    { name: 'Từ mới', noun: 'từ', byDay: addedByDay() },
    { name: 'Lượt xem', noun: 'lượt', byDay: viewsByDay() }
  ];
  let html = '';
  metrics.forEach((m, mi) => {
    const data = m.data = sums(m.byDay, bounds);
    const ts = ticks(Math.max(...data));
    const top = ts[ts.length - 1];
    const total = data.reduce((a, b) => a + b, 0);
    // Trung bình tính từ khoảng có số liệu đầu tiên, để thời gian trước khi app bắt đầu ghi không kéo số xuống
    const first = Object.keys(m.byDay).reduce((a, k) => (!a || k < a ? k : a), '');
    const from = first ? starts.findIndex((s, i) => dayKey(bounds[i + 1]) > first) : -1;
    let sum = `${n} ${unit} gần nhất: ${NUM.format(total)} ${m.noun}`;
    if (from !== -1 && n - from > 1) sum += ` · trung bình ${AVG.format(total / (n - from))} mỗi ${unit}`;
    const cols = data.map((v, i) => `<button class="col" type="button" data-i="${i}" aria-pressed="${i === sel}"`
      + ` tabindex="${i === sel ? 0 : -1}" aria-label="${esc(cap(names[i]))}: ${NUM.format(v)} ${m.noun}"`
      + ` style="--h:${v > 0 ? Math.max(v / top, 0.02).toFixed(4) : 0}"><i></i></button>`).join('');
    html += `<section class="metric" aria-labelledby="mt${mi}">
      <h3 id="mt${mi}">${m.name}</h3>
      <p class="fig"><b>${NUM.format(data[sel])}</b> ${m.noun} · ${esc(names[sel])}</p>
      <div class="chart">
        <div class="yax" aria-hidden="true">${ts.map(t => `<span style="--y:${t / top}">${NUM.format(t)}</span>`).join('')}</div>
        <div class="plot">${ts.map(t => `<i class="gl" style="--y:${t / top}"></i>`).join('')}<div class="cols" role="group" aria-label="${m.name} theo ${unit}">${cols}</div></div>
        <div class="xax" aria-hidden="true">${starts.map((s, i) => `<span${i === sel ? ' class="on"' : ''}>${tickName(statUnit, s, i, n)}</span>`).join('')}</div>
      </div>
      <p class="sum">${sum}</p>
    </section>`;
  });
  const rows = names.map((name, i) => `<tr><th scope="row">${esc(cap(name))}</th>`
    + `<td>${NUM.format(metrics[0].data[i])}</td><td>${NUM.format(metrics[1].data[i])}</td></tr>`).reverse().join('');
  html += `<details class="tbl"${statTable ? ' open' : ''}><summary>Xem dạng bảng</summary><table>
    <thead><tr><th scope="col">${cap(unit)}</th><th scope="col">Từ mới</th><th scope="col">Lượt xem</th></tr></thead>
    <tbody>${rows}</tbody></table></details>`;
  const notes = [];
  if (demo) notes.push('Đây là thẻ mẫu. Kết nối Sheet hoặc thêm từ để bắt đầu thống kê.');
  else {
    const unknown = items.filter(x => !validDate(x.added)).length;
    if (unknown) notes.push(`${NUM.format(unknown)} từ được thêm trước khi app ghi ngày thêm nên không tính vào Từ mới.`);
  }
  notes.push('Mỗi lần vuốt sang thẻ khác hay bấm Đã nắm rõ là một lượt xem. Xem trong Tất cả từ thì không tính.');
  html += notes.map(t => `<p class="note">${t}</p>`).join('');
  $statsBody.innerHTML = html;
}
// Chọn một cột: cả hai biểu đồ cùng hiện số của khoảng đó. focus: đưa focus về cột vừa chọn sau khi vẽ lại
function pickPeriod(el, i, focus) {
  const charts = Array.from($statsBody.querySelectorAll('.metric'));
  const k = charts.indexOf(el.closest('.metric'));
  statSel = i;
  renderStats();
  if (focus) $statsBody.querySelectorAll('.metric')[k].querySelector('.col[tabindex="0"]').focus();
}

/* ---------- Đồng bộ với Google Sheet ---------- */
async function sync() {
  if (syncing) return;
  if (!sheetIdOf(settings.sheet) || !scriptUrl()) { openSettings(); return; }
  syncing = true;
  $sync.classList.add('busy');
  const sending = pending;
  pending = dict();
  const fixing = edits;                          // sửa thêm trong lúc chờ thì vào edits mới, gửi lần sau
  edits = dict();
  const dropping = deletes;                      // xoá thêm trong lúc chờ cũng vậy
  deletes = dict();
  const adding = items.filter(x => x.local);
  adding.forEach(x => { x.tried = true; });      // đã gửi đi: xoá từ này sau đó thì phải báo cả Sheet
  const views = unsentViews();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    // Mỗi thay đổi kèm chữ của từ; script tìm dòng trong Sheet theo chữ đó
    const changes = Object.keys(sending).map(k => Object.assign({ term: k }, sending[k]));
    const fixes = Object.keys(fixing).map(k => Object.assign({ term: k }, fixing[k]));
    const removes = Object.keys(dropping).map(k => ({ term: k }));
    // body là chuỗi nên trình duyệt gửi dạng text/plain, Apps Script nhận được mà không vướng CORS
    const res = await fetch(scriptUrl(), {
      method: 'POST',
      body: JSON.stringify({ api: API, sheet: sheetIdOf(settings.sheet), key: settings.key, changes, adds: adding,
        edits: fixes, deletes: removes, device: log.device, views }),
      signal: ctrl.signal
    });
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch (_) {}
    if (!data || typeof data !== 'object') {
      throw new Error(settings.url
        ? 'Link chưa đúng. Dùng link Web app đuôi /exec, quyền truy cập Anyone.'
        : 'Script chung đang trục trặc, thử lại sau.');
    }
    if (!data.ok) throw new Error(`Sheet báo lỗi: ${data.error || 'không rõ'}.`);
    if (data.key) {                              // script vừa thiết lập Sheet trống và tạo mã
      settings.key = String(data.key);
      store(KEYS.settings, settings);
    }
    // Script bản trước còn tìm từ theo cột id nên không ghi được gì từ app này: giữ mọi thay đổi trong máy
    if (!(data.api >= API)) {
      throw new Error('Script chưa được cập nhật nên chưa nhận thay đổi từ app. Thay đổi vẫn lưu trong máy.');
    }

    const wasDemo = demo;
    demo = false;
    types = (Array.isArray(data.types) ? data.types : []).filter(x => x && typeName(x.type))
      .map(x => ({ type: typeName(x.type), abbr: String(x.abbr == null ? '' : x.abbr).trim() }));
    store(KEYS.types, types);
    const got = dedupe((Array.isArray(data.items) ? data.items : []).map(fill));
    const gotBy = new Map(got.map(x => [keyOf(x), x]));
    // Lượt xem Sheet đã ghi. Lượt xem Sheet chưa ghi đủ thì để gửi lần sau
    if (data.log && typeof data.log === 'object') {
      log.synced = counts(data.log.mine);
      log.others = counts(data.log.others);
    }
    // Ngày thêm: ô trong Sheet còn trống mà thẻ trong máy có ngày (từ thêm lúc script chưa có cột added) thì giữ ngày
    // trong máy, và gửi lên ở lần đồng bộ sau
    const had = new Map(items.map(x => [keyOf(x), x.added]));
    got.forEach(x => {
      const k = keyOf(x), a = had.get(k);
      if (x.added || !validDate(a)) return;
      x.added = a;
      pending[k] = Object.assign({}, pending[k], { added: a });
    });
    // Bản sửa: Sheet đã có nội dung mới thì xong; nằm trong conflicts thì Sheet giữ bản của nó (ô vừa được sửa thẳng
    // trong Sheet, hay từ không còn trong Sheet). Còn lại thì giữ để gửi lần sau
    const conflicts = new Set((Array.isArray(data.conflicts) ? data.conflicts : []).map(normTerm));
    const lost = [];
    Object.keys(fixing).forEach(k => {
      const it = gotBy.get(k);
      if (it && Object.keys(fixing[k]).every(name => it[name] === fixing[k][name].to)) return;
      if (conflicts.has(k)) lost.push(it ? it.term : '');
      else keepEdits({ [k]: fixing[k] });
    });
    // Từ đã xoá thì script xoá dòng của từ đó (dòng không còn thì thôi), nên không cần làm gì thêm.
    // Từ mới thêm trong lúc chờ đồng bộ thì giữ lại trong máy. Từ xoá trong lúc chờ thì vẫn ẩn
    items = got.concat(items.filter(x => x.local && !gotBy.has(keyOf(x)))).filter(x => !deletes[keyOf(x)]);
    const byKey = new Map(items.map(x => [keyOf(x), x]));
    Object.keys(pending).forEach(k => {          // thao tác làm trong lúc đang chờ đồng bộ
      const it = byKey.get(k);
      if (it) Object.assign(it, pending[k]);
    });
    applyEdits();
    lastSync = new Date().toISOString();
    store(KEYS.lastSync, lastSync);
    persist();
    const same = !wasDemo && current ? byKey.get(keyOf(current)) : null;
    if (same && !same.mastered) show(same); else next();
    refreshLib();
    // Sheet có từ ở nhiều dòng: app chỉ dùng dòng trên cùng, nhắc người dùng gộp lại
    const dupes = (Array.isArray(data.dupes) ? data.dupes : []).map(String);
    toast(data.key ? `Đã thiết lập Sheet, mã bí mật là ${data.key}. Xem lại trong ⚙.`
      : lost.length === 1 && lost[0] ? `Bản sửa “${lost[0]}” không được ghi vì từ này vừa đổi trong Sheet.`
      : lost.length ? `${lost.length} bản sửa không được ghi vì từ đã đổi hoặc bị xoá trong Sheet.`
      : dupes.length === 1 ? `“${dupes[0]}” có ở nhiều dòng trong Sheet, app chỉ dùng dòng trên cùng.`
      : dupes.length ? `${dupes.length} từ có ở nhiều dòng trong Sheet (${dupes.slice(0, 3).join(', ')}`
        + `${dupes.length > 3 ? '…' : ''}), app chỉ dùng dòng trên cùng.`
      : `Đã đồng bộ ${got.length} thẻ`);
  } catch (err) {
    Object.keys(sending).forEach(k => { pending[k] = Object.assign({}, sending[k], pending[k]); });
    keepEdits(fixing);
    Object.assign(deletes, dropping);
    persist();
    toast(!navigator.onLine ? 'Chưa có mạng. Thay đổi vẫn lưu trong máy, có mạng thì bấm đồng bộ lại.'
      : err.name === 'AbortError' ? 'Script không trả lời sau 30 giây. Bấm đồng bộ lại.'
      : err instanceof TypeError ? 'Không gọi được script. Kiểm tra mạng và link trong ⚙.'
      : err.message);
  } finally {
    clearTimeout(timer);
    syncing = false;
    $sync.classList.remove('busy');
    renderTop();
  }
}

/* ---------- Cài đặt ---------- */
function openSettings() {
  $sheet.value = settings.sheet;
  $key.value = settings.key;
  $url.value = settings.url;
  const n = unsynced();
  $info.textContent = (lastSync ? `Đồng bộ gần nhất lúc ${fmtDateTime(lastSync)}.` : 'Chưa đồng bộ lần nào.')
    + (n ? ` Còn ${n} thay đổi chưa gửi lên Sheet.` : '');
  if (!$dlg.open) $dlg.showModal();
}
function saveSettings() {
  settings = { sheet: $sheet.value.trim(), key: $key.value.trim(), url: $url.value.trim() };
  const saved = store(KEYS.settings, settings);
  $dlg.close();
  if (!saved) { toast('Không lưu được cài đặt vào máy.'); return; }
  if (!settings.sheet) return;
  if (!sheetIdOf(settings.sheet)) {
    toast('Link Sheet cần có dạng https://docs.google.com/spreadsheets/d/…');
    return;
  }
  if (settings.url && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(settings.url)) {
    toast('Link script cần có dạng https://script.google.com/…/exec');
    return;
  }
  if (!scriptUrl()) { toast('Chưa có script chung, hãy dán link Apps Script của bạn.'); return; }
  sync();
}

  pending = dict(load(KEYS.pending, {}));
  edits = dict(load(KEYS.edits, {}));
  deletes = dict(load(KEYS.deletes, {}));
  types = load(KEYS.types, []);
  if (!Array.isArray(types)) types = [];
  settings = Object.assign({ sheet: '', key: '', url: '' }, load(KEYS.settings, {}));
  lastSync = load(KEYS.lastSync, '');
  loadLog();
  migrate();
  if (!items.length && !lastSync) {
    items = DEMO.map(x => Object.assign({}, x));
    demo = true;
  }
  next();
  renderTop();
  renderTypes();
  renderSyns();

  $card.addEventListener('pointerdown', onDown);
  $card.addEventListener('pointermove', onMove);
  $card.addEventListener('pointerup', onUp);
  $card.addEventListener('pointercancel', onUp);
  $master.addEventListener('click', master);
  $next.addEventListener('click', () => swipe(-1));
  $sync.addEventListener('click', sync);
  $('btnSettings').addEventListener('click', openSettings);
  $('btnSave').addEventListener('click', saveSettings);
  $('btnClose').addEventListener('click', () => $dlg.close());
  [$sheet, $key, $url].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') saveSettings(); }));
  $('btnAdd').addEventListener('click', () => openAdd());
  $card.addEventListener('click', e => { if (!busy && current && e.target.closest('.edit')) openAdd(current); });
  $addSave.addEventListener('click', saveWord);
  $('btnAddClose').addEventListener('click', () => $add.close());
  $addDel.addEventListener('click', askDelete);
  $('btnDelCancel').addEventListener('click', () => $del.close());
  $('btnDelOk').addEventListener('click', deleteWord);
  $add.addEventListener('close', () => { if (editing) resetForm(); });  // đóng bảng sửa thì bỏ phần chưa bấm Cập nhật
  // Ngừng gõ ô Từ một chút thì tra xem từ đã có chưa
  $term.addEventListener('input', () => {
    checkAdd();
    clearTimeout(lookupTimer);
    lookupTimer = setTimeout(() => { if ($add.open) lookup(); }, 400);
  });
  [$phonetic, $meaning, $example].forEach(el => el.addEventListener('input', checkAdd));
  tagField($tags, $typeIn, $sugg, pickType, unpickType, () => picked, renderSugg);
  tagField($synTags, $synIn, $synSugg, pickSyn, unpickSyn, () => syns, renderSynSugg);
  // Enter ở ô Từ: tra từ rồi sang ô Phiên âm; ở ô Phiên âm: sang ô Loại từ; ở ô Loại từ: chọn loại vừa gõ, ô trống thì
  // sang ô Nghĩa; ở ô Từ đồng nghĩa: thêm từ vừa gõ, ô trống thì sang ô Ví dụ.
  // Ctrl+Enter (Mac: ⌘+Enter) ở ô nào cũng là bấm nút chính
  $add.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); saveWord(); }
    else if (e.target === $term) { e.preventDefault(); lookup(); $phonetic.focus(); }
    else if (e.target === $phonetic) { e.preventDefault(); $typeIn.focus(); }
    else if (e.target === $typeIn) {
      e.preventDefault();
      if (typeName($typeIn.value)) pickType($typeIn.value); else $meaning.focus();
    } else if (e.target === $synIn) {
      e.preventDefault();
      if (typeName($synIn.value)) pickSyn($synIn.value); else $example.focus();
    }
  });
  // Tất cả từ và Thống kê. Chạm số thẻ ở thanh trên là mở Thống kê; lúc còn thẻ mẫu thì mở cài đặt để kết nối Sheet
  $('btnLib').addEventListener('click', () => openLib('words'));
  $stats.addEventListener('click', () => { if (demo) openSettings(); else openLib('stats'); });
  $('btnLibClose').addEventListener('click', () => $lib.close());
  $tabWords.addEventListener('click', () => showTab('words'));
  $tabStats.addEventListener('click', () => showTab('stats'));
  $('tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const words = !$paneWords.hidden;
    showTab(words ? 'stats' : 'words');
    (words ? $tabStats : $tabWords).focus();
  });
  $find.addEventListener('input', () => renderWords());
  $sort.addEventListener('change', () => { libSort = $sort.value; renderWords(); });
  $filt.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) { libFilter = b.dataset.f; renderWords(); }
  });
  $words.addEventListener('click', e => {
    const b = e.target.closest('.row');
    if (b) openView(Number(b.dataset.i));
  });
  $wordsBox.addEventListener('scroll', () => {
    if ($wordsBox.scrollTop + $wordsBox.clientHeight > $wordsBox.scrollHeight - 800) moreWords();
  }, { passive: true });
  $units.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.dataset.u === statUnit) return;
    statUnit = b.dataset.u;
    statSel = -1;
    renderStats();
  });
  $statsBody.addEventListener('click', e => {
    const c = e.target.closest('.col');
    if (c) pickPeriod(c, Number(c.dataset.i), document.activeElement === c);
  });
  // Rê chuột trên máy tính cũng chọn cột, như chạm trên điện thoại
  $statsBody.addEventListener('pointerover', e => {
    const c = e.pointerType === 'mouse' && e.target.closest('.col');
    if (c && c.getAttribute('aria-pressed') !== 'true') pickPeriod(c, Number(c.dataset.i), false);
  });
  $statsBody.addEventListener('keydown', e => {
    const c = e.target.closest('.col');
    if (!c) return;
    const i = Number(c.dataset.i), n = SPAN[statUnit];
    const to = { ArrowLeft: i - 1, ArrowRight: i + 1, Home: 0, End: n - 1 }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    if (to >= 0 && to < n) pickPeriod(c, to, true);
  });
  $statsBody.addEventListener('toggle', e => { statTable = e.target.open; }, true);
  // Xem một từ
  $('btnViewBack').addEventListener('click', () => $view.close());
  $prev.addEventListener('click', () => viewStep(-1));
  $nextWord.addEventListener('click', () => viewStep(1));
  $viewCard.addEventListener('click', e => {
    const it = !viewBusy && e.target.closest('.edit') && viewItem();
    if (it) openAdd(it);
  });
  $viewCard.addEventListener('pointerdown', onViewDown);
  $viewCard.addEventListener('pointermove', onViewMove);
  $viewCard.addEventListener('pointerup', onViewUp);
  $viewCard.addEventListener('pointercancel', onViewUp);
  // Quay lại danh sách: cuộn tới từ vừa xem
  $view.addEventListener('close', () => {
    const k = viewKeys[viewAt];
    const i = libList.findIndex(x => keyOf(x) === k);
    if (!$lib.open || i === -1) return;
    moreWords(i + 1);
    const row = $words.children[i];
    if (!row) return;
    row.scrollIntoView({ block: 'nearest' });
    row.firstElementChild.focus({ preventScroll: true });
  });

  // Phím ← →: đổi thẻ lúc học, sang từ trước/sau lúc xem một từ. Đang mở bảng khác thì để phím cho bảng đó
  document.addEventListener('keydown', e => {
    const top = topDialog();
    if (top === $view) {
      if (e.key === 'ArrowRight') viewStep(1);
      else if (e.key === 'ArrowLeft') viewStep(-1);
      return;
    }
    if (top) return;
    if (e.key === 'ArrowRight') swipe(1);
    else if (e.key === 'ArrowLeft') swipe(-1);
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

if (typeof document !== 'undefined') init();
</script>
</body>
</html>
