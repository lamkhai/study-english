<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Từ vựng</title>
<meta name="theme-color" content="#22314f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1424" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Từ vựng">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  /* Bàn học xanh mực, thẻ giấy có dòng kẻ, bút dạ quang cho cụm từ đánh dấu *...* */
  :root {
    --desk: #22314f;
    --desk-text: #e3e9f4;
    --desk-muted: #a3b2cc;
    --desk-line: rgba(255, 255, 255, .18);
    --paper: #fffefb;
    --rule: #d5e3f2;
    --ink: #1d2742;
    --pencil: #687089;
    --marker: #ffe45c;
    --mark-from: 50%;
    --badge: #ffe45c;
    --line-vocab: #e26868;
    --line-grammar: #3c9a6d;
    --danger: #c43a31;
    --danger-fill: #c43a31;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --desk: #0e1424;
      --desk-text: #dfe5f1;
      --desk-muted: #8796b2;
      --desk-line: rgba(255, 255, 255, .13);
      --paper: #18203a;
      --rule: rgba(150, 180, 230, .12);
      --ink: #e8ecf5;
      --pencil: #98a3bb;
      --marker: #d9b83c;
      --mark-from: 76%;
      --line-vocab: #d36767;
      --line-grammar: #4bae80;
      --danger: #f08a80;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--desk);
    color: var(--desk-text);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--badge); outline-offset: 2px; }

  .app {
    height: 100%;
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px calc(env(safe-area-inset-bottom, 0px) + 16px);
  }

  /* Thanh trên: số thẻ, đồng bộ, cài đặt */
  .top { display: flex; align-items: center; gap: 10px; }
  .stats { flex: 1; margin: 0; font-size: 15px; color: var(--desk-muted); }
  .stats b { color: var(--desk-text); font-weight: 600; }
  .tool {
    position: relative;
    flex: none;
    width: 42px;
    height: 42px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 1px solid var(--desk-line);
    border-radius: 12px;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
  }
  .tool svg { width: 20px; height: 20px; }
  .tool.busy svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .count {
    position: absolute;
    top: -7px;
    right: -7px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 10px;
    background: var(--badge);
    color: #1d2742;
    font-size: 11px;
    font-weight: 700;
    line-height: 20px;
    text-align: center;
  }
  .count[hidden] { display: none; }

  /* Chồng thẻ */
  .deck { position: relative; flex: 1; min-height: 0; display: flex; margin: 16px 0 14px; }
  .deck::before {
    content: "";
    position: absolute;
    inset: 12px 8px -7px;
    border-radius: 6px;
    background: var(--paper);
    opacity: .3;
    transform: rotate(-1.6deg);
  }
  .card {
    --line: var(--line-vocab);
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-radius: 6px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 1px 0 rgba(0, 0, 0, .08), 0 18px 30px -14px rgba(0, 0, 0, .55);
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
    /* Thẻ nằm trên một lớp riêng của GPU: lúc kéo, máy chỉ dịch lớp đó chứ không vẽ lại thẻ mỗi khung hình */
    will-change: transform;
    transition: transform .2s ease, opacity .2s ease;
  }
  .card.grammar { --line: var(--line-grammar); }
  .head { padding: 22px 22px 12px; border-bottom: 2px solid var(--line); }
  .term {
    margin: 0;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, Roboto, sans-serif;
    font-size: clamp(28px, 8.6vw, 40px);
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -.01em;
    overflow-wrap: anywhere;
  }
  /* Phiên âm ngay dưới từ, hiện đúng như người dùng gõ */
  .phon { margin: 6px 0 0; font-size: 17px; line-height: 1.35; color: var(--pencil); overflow-wrap: anywhere; }
  /* Dòng kẻ cách nhau 28px, chữ nằm đúng trên dòng */
  .body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 22px;
    line-height: 28px;
    overflow-wrap: anywhere;      /* link hay chuỗi dài không dấu cách thì xuống dòng, không làm thẻ phình ra ngoài màn hình */
    background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px);
    background-attachment: local;
  }
  .meaning { margin: 0 0 28px; font-size: 19px; font-weight: 500; }
  .meaning i { color: var(--pencil); }
  .ex { margin: 0; font-family: ui-serif, "New York", "Noto Serif", Georgia, serif; font-size: 17.5px; }
  .ex i { color: var(--pencil); }
  .card b {
    font-weight: 700;
    padding: 0 2px;
    background: linear-gradient(transparent var(--mark-from), var(--marker) var(--mark-from));
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .foot {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 22px 14px;
    font-size: 13px;
    color: var(--pencil);
  }
  .foot span:first-child { margin-right: auto; }
  .foot .seen { text-align: right; }
  /* Nút ✎ sửa thẻ: lề âm để chân thẻ không cao thêm */
  .foot .edit {
    flex: none;
    width: 32px;
    height: 32px;
    margin: -6px -8px -6px 0;
    padding: 0;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--pencil);
    cursor: pointer;
    touch-action: manipulation;
  }
  .foot .edit svg { width: 16px; height: 16px; }
  .empty { margin: auto; padding: 24px; text-align: center; line-height: 1.6; color: var(--pencil); }

  .hint { margin: 0 0 12px; text-align: center; font-size: 13px; color: var(--desk-muted); }
  /* Hai nút dưới cùng: Đã nắm rõ và Thẻ tiếp */
  .bar { display: flex; gap: 10px; }
  .bar button {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 54px;
    padding: 0 8px;
    border: 1px solid var(--desk-line);
    border-radius: 14px;
    background: rgba(255, 255, 255, .08);
    font-size: 17px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
  }
  .bar svg { flex: none; width: 20px; height: 20px; }
  .bar button:active:not(:disabled) { background: rgba(255, 255, 255, .16); }
  .bar button:disabled { opacity: .35; cursor: default; }
  /* Thẻ tiếp là nút bấm nhiều nhất nên nổi nhất: nền sáng, chữ màu bàn, ở cả chế độ sáng lẫn tối */
  .bar .next { border-color: transparent; background: var(--desk-text); color: var(--desk); }
  .bar .next:active:not(:disabled) { background: var(--desk-text); opacity: .8; }

  /* Thông báo nhỏ phía dưới */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 16px;
    width: max-content;
    max-width: calc(100% - 36px);
    padding: 9px 16px;
    border-radius: 10px;
    background: var(--badge);
    color: #1d2742;
    font-size: 15px;
    line-height: 1.4;
    box-shadow: 0 12px 28px -10px rgba(0, 0, 0, .55);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 10px);
    transition: opacity .2s, transform .2s;
  }
  #toastMsg { min-width: 0; overflow-wrap: anywhere; }
  .toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  .toast button {
    flex: none;
    padding: 6px 0;
    border: 0;
    background: none;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* Cài đặt */
  dialog {
    width: min(92vw, 420px);
    padding: 22px;
    border: 0;
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 24px 48px -16px rgba(0, 0, 0, .6);
  }
  dialog::backdrop { background: rgba(8, 12, 22, .55); }
  dialog h2 { margin: 0 0 4px; font-size: 20px; }
  dialog label { display: block; margin: 16px 0 6px; font-size: 14px; color: var(--pencil); }
  dialog input, dialog textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
  }
  dialog textarea { display: block; resize: vertical; }
  dialog input:focus-visible, dialog textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 0; }
  /* Loại từ: loại đã chọn nằm trong ô, chạm × để bỏ. Gõ vào ô để lọc gợi ý bên dưới, hoặc tạo loại mới */
  .tags {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 5px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    cursor: text;
  }
  .tags:focus-within { outline: 2px solid var(--ink); outline-offset: 0; }
  dialog .tags input { flex: 1; width: auto; min-width: 6em; padding: 6px 7px; border: 0; }
  dialog .tags input:focus-visible { outline: none; }
  .tag {
    display: flex;
    align-items: center;
    min-width: 0;
    max-width: 100%;
    padding-left: 12px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--paper);
    font-size: 15px;
    line-height: 1.4;
  }
  .tag span { min-width: 0; overflow-wrap: anywhere; }
  .tag button {
    flex: none;
    width: 32px;
    height: 30px;
    padding: 0 2px 0 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chips:empty { display: none; }
  .chips button {
    max-width: 100%;
    padding: 6px 13px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: transparent;
    font-size: 15px;
    line-height: 1.4;
    text-align: left;
    overflow-wrap: anywhere;
    cursor: pointer;
    touch-action: manipulation;
  }
  .chips .new { border-style: dashed; border-color: var(--pencil); }
  .info { margin: 16px 0 0; font-size: 13px; line-height: 1.5; color: var(--pencil); }
  .info.tip { margin-top: 6px; }
  .info.warn { margin-top: 8px; color: var(--ink); font-weight: 600; }
  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .actions button {
    flex: 1;
    height: 46px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: transparent;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }
  .actions .primary { flex: 1.7; border-color: transparent; background: var(--ink); color: var(--paper); }
  .actions .primary:disabled { opacity: .35; cursor: default; }
  .actions .del { color: var(--danger); }
  .actions .primary.danger { background: var(--danger-fill); color: #fff; }

  @media (prefers-reduced-motion: reduce) {
    .card, .toast { transition: none; }
    .tool.busy svg { animation: none; }
    .tool.busy { opacity: .5; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <p class="stats" id="stats"></p>
    <button class="tool" id="btnAdd" type="button" aria-label="Thêm từ mới">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="tool" id="btnSync" type="button" aria-label="Đồng bộ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span class="count" id="badge" hidden></span>
    </button>
    <button class="tool" id="btnSettings" type="button" aria-label="Cài đặt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main class="deck">
    <article class="card" id="card" aria-live="polite"></article>
  </main>

  <p class="hint" id="hint">Vuốt ngang để đổi thẻ</p>
  <div class="bar">
    <button id="btnMaster" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
      Đã nắm rõ
    </button>
    <button class="next" id="btnNext" type="button">
      Thẻ tiếp
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast" role="status">
  <span id="toastMsg"></span>
  <button id="toastAct" type="button" hidden></button>
</div>

<dialog id="dlg">
  <h2>Kết nối Google Sheet</h2>
  <label for="inSheet">Link Google Sheet</label>
  <input id="inSheet" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://docs.google.com/spreadsheets/d/…">
  <p class="info tip" id="help" hidden></p>
  <label for="inKey">Mã bí mật</label>
  <input id="inKey" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Sheet mới thì bỏ trống, app tự tạo mã">
  <label for="inUrl" id="lblUrl">Link Apps Script (đuôi /exec)</label>
  <input id="inUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
  <p class="info" id="info"></p>
  <div class="actions">
    <button id="btnClose" type="button">Đóng</button>
    <button id="btnSave" type="button" class="primary">Lưu và đồng bộ</button>
  </div>
</dialog>

<dialog id="dlgAdd">
  <h2 id="addTitle">Thêm từ mới</h2>
  <label for="inTerm">Từ</label>
  <input id="inTerm" type="text" autocomplete="off" autocapitalize="none" enterkeyhint="next" placeholder="make up for" autofocus>
  <p class="info warn" id="addMsg" role="status" hidden></p>
  <label for="inPhonetic">Phiên âm</label>
  <input id="inPhonetic" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="/meɪk ʌp fɔːr/">
  <label for="inType">Loại từ</label>
  <div class="tags" id="tags">
    <input id="inType" type="text" maxlength="30" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  </div>
  <div class="chips" id="sugg" role="group" aria-label="Gợi ý loại từ"></div>
  <label for="inMeaning">Nghĩa</label>
  <textarea id="inMeaning" rows="2" autocapitalize="none" placeholder="bù đắp cho"></textarea>
  <label for="inExample">Ví dụ</label>
  <textarea id="inExample" rows="3" placeholder="He stayed late to *make up for* the lost time."></textarea>
  <p class="info tip">Bọc *cụm từ* để tô đậm. Mỗi ví dụ một dòng.</p>
  <div class="actions">
    <button id="btnAddDel" type="button" class="del" hidden>Xoá</button>
    <button id="btnAddClose" type="button">Đóng</button>
    <button id="btnAddSave" type="button" class="primary">Thêm</button>
  </div>
</dialog>

<dialog id="dlgDel">
  <h2 id="delTitle">Xoá từ này?</h2>
  <p class="info" id="delText"></p>
  <div class="actions">
    <button id="btnDelCancel" type="button">Huỷ</button>
    <button id="btnDelOk" type="button" class="primary danger">Xoá</button>
  </div>
</dialog>

<script>
'use strict';

const KEYS = {
  items: 'tv.items', pending: 'tv.pending', edits: 'tv.edits', deletes: 'tv.deletes', types: 'tv.types',
  settings: 'tv.settings', lastSync: 'tv.lastSync'
};

// Loại từ do người dùng tạo, lưu ở tab types của Sheet. Đây chỉ là chữ viết tắt quen thuộc đặt trước nghĩa khi từ
// có nhiều loại: (n) cuộc chạy. Cột abbr ở tab types ghi đè; loại không có ở đây mà chưa ghi abbr thì dùng nguyên tên.
const ABBR = {
  noun: 'n', verb: 'v', adjective: 'adj', adverb: 'adv', pronoun: 'pron', preposition: 'prep',
  conjunction: 'conj', interjection: 'interj', 'phrasal verb': 'phr v'
};
// Dòng nghĩa mở đầu bằng loại viết tắt: (n) cuộc chạy. Tên loại dài tối đa 30 ký tự (ô Loại từ cũng giới hạn vậy)
const PREFIX = /^\([^)]{1,30}\)/;

// Script chung do người quản lý app deploy bằng Gmail bot (xem README).
// Để trống thì người dùng phải tự dựng script và dán link /exec của họ vào ⚙.
// BOT_EMAIL để trống thì ⚙ không hiện email bot; người quản lý tự gửi email bot cho người dùng.
const SHARED_URL = 'https://script.google.com/macros/s/AKfycbwcHehzUPC07oMh4-PqGRxwX5AvZzLPS4Y2Fb6GkvJ1RX3TENTF9T-_weUpoA5bk2yI/exec';
const BOT_EMAIL = '';

// Thẻ mẫu: chỉ hiện khi chưa đồng bộ lần nào, không được lưu vào máy
const DEMO = [
  { id: 'demo-1', type: 'phrase', term: 'in conjunction with', phonetic: '/ɪn kənˈdʒʌŋkʃən wɪð/', meaning: 'kết hợp với',
    example: 'hooks, states, props, Redux *in conjunction with* React components',
    lastSeen: '', mastered: false },
  { id: 'demo-2', type: 'grammar', term: 'have/has been + V-ing', phonetic: '',

/* ---------- Hàm tiện ích ---------- */
const pad = n => String(n).padStart(2, '0');
function validDate(iso) { return !!iso && !isNaN(Date.parse(iso)); }
function fmtDate(iso) {
  const d = new Date(iso);
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return `${fmtDate(iso)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function daysAgo(iso, now) {
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  return Math.round((day(now ? new Date(now) : new Date()) - day(new Date(iso))) / 86400000);
}
function agoText(n) { return n <= 0 ? 'hôm nay' : n === 1 ? 'hôm qua' : `${n} ngày trước`; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}
// *cụm từ*  →  cụm từ in đậm, tô dạ quang
function rich(s) { return esc(s).replace(/\*(.+?)\*/g, '<b>$1</b>'); }
function lines(s) { return String(s == null ? '' : s).split(/\r?\n/).map(l => l.trim()).filter(Boolean); }
// Tên loại từ gọn: bỏ khoảng trắng thừa
function typeName(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' '); }
// "noun,  phrasal   verb" → ['noun', 'phrasal verb']
function typesOf(type) { return String(type == null ? '' : type).split(',').map(typeName).filter(Boolean); }
// So từ, và so loại từ: không phân biệt hoa thường và khoảng trắng thừa
function normTerm(s) { return String(s == null ? '' : s).normalize('NFC').trim().replace(/\s+/g, ' ').toLowerCase(); }
// Thẻ lưu trong máy từ bản app trước, hay do script cũ trả về, chưa có phiên âm
function fill(it) {
  if (typeof it.phonetic !== 'string') it.phonetic = '';
  return it;
}
// ID của Sheet: lấy từ link …/spreadsheets/d/<ID>/edit (kể cả dạng /u/1/d/), hoặc nhận thẳng ID
function sheetIdOf(s) {
  const m = /\/spreadsheets\/(?:u\/\d+\/)?d\/([\w-]{20,})/.exec(s) || /^([\w-]{20,})$/.exec(s);
  return m ? m[1] : '';
}
function scriptUrl() { return settings.url || SHARED_URL; }
// Id 12 ký tự hex cho từ thêm trong app; script giữ nguyên id này khi ghi vào Sheet
function newId() {
  return Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join('');
}
function kindOf(type) {
  const raw = String(type == null ? '' : type).trim();
  const t = raw.toLowerCase().normalize('NFC');
  if (['grammar', 'ngữ pháp', 'ngu phap'].includes(t)) return { label: 'Ngữ pháp', cls: 'grammar' };
  if (['vocab', 'vocabulary', 'word', 'từ vựng', 'tu vung'].includes(t)) return { label: 'Từ vựng', cls: '' };
  return { label: raw, cls: '' };
}

/* ---------- Chọn thẻ tiếp theo ----------
   Ngẫu nhiên có trọng số: thẻ chưa xem 1.5, thẻ xem cách đây từ 3 ngày trở lên 1,
   thẻ vừa xem gần bằng 0 nên hầu như không lặp lại ngay. */
function weight(item, now) {
  if (!validDate(item.lastSeen)) return 1.5;
  const days = Math.max(0, (now - Date.parse(item.lastSeen)) / 86400000);
  return Math.min(1, 0.01 + days / 3);
}
function pickNext(list, excludeId, now, rnd) {
  now = now || Date.now();
  rnd = rnd || Math.random;
  let pool = list.filter(x => !x.mastered);
  if (pool.length > 1) pool = pool.filter(x => x.id !== excludeId);
  if (!pool.length) return null;
  const w = pool.map(x => weight(x, now));
  let r = rnd() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) {
    r -= w[i];
    if (r < 0) return pool[i];
  }
  return pool[pool.length - 1];
}

/* ---------- Lưu trong máy ---------- */
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (_) { return fallback; }
}
function store(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (_) { return false; }
}
function persist() {
  if (demo) return true;
  const ok = store(KEYS.items, items) && store(KEYS.pending, pending) && store(KEYS.edits, edits)
    && store(KEYS.deletes, deletes);
  if (!ok) toast('Không lưu được vào bộ nhớ máy. Kiểm tra dung lượng trống.');
  return ok;
}
// Số thẻ có thay đổi chưa gửi lên Sheet: tiến độ học, bản sửa, từ đã xoá, hoặc từ mới thêm trong app (mỗi thẻ tính một lần)
function unsynced() {
  const ids = new Set(Object.keys(pending).concat(Object.keys(edits), Object.keys(deletes)));
  items.forEach(x => { if (x.local) ids.add(x.id); });
  return ids.size;
}
function recordChange(item, patch) {
  Object.assign(item, patch);
  if (!demo) {
    pending[item.id] = Object.assign({}, pending[item.id], patch);
    persist();
  }
  renderTop();
}
// Bản sửa chưa gửi được thì trả về hàng đợi; ô nào sửa thêm trong lúc chờ thì giữ "from" cũ, "to" mới
function keepEdits(sent) {
  Object.keys(sent).forEach(id => {
    const ed = Object.assign({}, sent[id]);
    Object.keys(edits[id] || {}).forEach(name => {
      ed[name] = { from: sent[id][name] ? sent[id][name].from : edits[id][name].from, to: edits[id][name].to };
    });
    edits[id] = ed;
  });
}
// Áp các bản sửa còn trong máy lên thẻ vừa nhận từ Sheet
function applyEdits() {
  Object.keys(edits).forEach(id => {
    const it = items.find(x => x.id === id);
    if (it) Object.keys(edits[id]).forEach(name => { it[name] = edits[id][name].to; });
  });
}

/* ---------- Giao diện ---------- */
function renderTop() {
  const left = items.filter(x => !x.mastered).length;
  $stats.innerHTML = demo
    ? 'Thẻ mẫu, bấm ⚙ để kết nối Sheet'
    : `<b>${left}</b> đang học, <b>${items.length - left}</b> đã nắm rõ`;
  const n = unsynced();
  $badge.hidden = n === 0;
  $badge.textContent = n > 99 ? '99+' : String(n);
  $sync.setAttribute('aria-label', n ? `Đồng bộ (${n} thay đổi chưa đồng bộ)` : 'Đồng bộ');
}

function renderCard() {
  const it = current;
  $master.disabled = $next.disabled = !it;
  $hint.style.visibility = it ? '' : 'hidden';
  if (!it) {
    $card.className = 'card';
    $card.innerHTML = `<p class="empty">${items.length
      ? 'Bạn đã nắm rõ hết các thẻ.<br>Bấm + để thêm từ mới.'
      : 'Sheet chưa có từ nào.<br>Bấm + để thêm từ mới.'}</p>`;
    return;
  }
  const kinds = typesOf(it.type).map(kindOf);
  // (n) cuộc chạy: phần loại từ ở đầu dòng in nghiêng
  const meaning = lines(it.meaning).map(l => rich(l).replace(PREFIX, '<i>$&</i>')).join('<br>');
  const examples = lines(it.example)
    .map((l, i) => `<p class="ex">${i === 0 ? '<i>e.g.</i> ' : ''}${rich(l)}</p>`)
    .join('');
  const seen = validDate(it.lastSeen)
    ? `${fmtDate(it.lastSeen)} (${agoText(daysAgo(it.lastSeen))})`
    : 'chưa xem';
  const edit = demo ? '' : '<button class="edit" type="button" aria-label="Sửa thẻ này"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>';
  const phon = it.phonetic ? `<p class="phon">${esc(it.phonetic)}</p>` : '';
  $card.className = kinds.some(k => k.cls === 'grammar') ? 'card grammar' : 'card';
  $card.innerHTML = `
    <div class="head"><h1 class="term">${esc(it.term)}</h1>${phon}</div>
    <div class="body">${meaning ? `<p class="meaning">${meaning}</p>` : ''}${examples}</div>
    <div class="foot"><span>${esc(kinds.map(k => k.label).join(', '))}</span><span class="seen">last seen: ${seen}</span>${edit}</div>`;
}

function show(it) { current = it; renderCard(); }
function next() { show(pickNext(items, current && current.id)); }

// Thẻ cũ bay ra (dir: -1 trái, 1 phải, 0 lên trên), thẻ mới trồi lên từ chồng thẻ
function leave(dir, after) {
  busy = true;
  $card.style.transition = '';
  $card.style.transform = dir === 0
    ? 'translateY(-40px) scale(.96)'
    : `translateX(${dir * (window.innerWidth + 60)}px) rotate(${dir * 12}deg)`;
  $card.style.opacity = '0';
  setTimeout(() => {
    after();
    $card.style.transition = 'none';
    $card.style.transform = 'translateY(14px) scale(.98)';
    void $card.offsetWidth;
    $card.style.transition = '';
    $card.style.transform = '';
    $card.style.opacity = '';
    busy = false;                        // thẻ mới vừa hiện là kéo tiếp được, không phải đợi nó trồi lên xong
  }, 200);
}

// Vuốt: ghi lại lúc vừa xem thẻ này, rồi sang thẻ khác
function swipe(dir) {
  if (busy || !current) return;
  const it = current;
  leave(dir, () => {
    recordChange(it, { lastSeen: new Date().toISOString() });
    next();
  });
}

function master() {
  if (busy || !current) return;
  const it = current;
  recordChange(it, { mastered: true, lastSeen: new Date().toISOString() });
  leave(0, next);
  toast(`Đã nắm rõ “${it.term}”`, 'Hoàn tác', function undo() {
    if (busy) { setTimeout(undo, 120); return; }
    recordChange(it, { mastered: false });
    show(it);
  });
}

/* ---------- Kéo thẻ ---------- */
function onDown(e) {
  if (busy || !current || (e.pointerType === 'mouse' && e.button !== 0)) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, t: e.timeStamp, dx: 0, v: 0, on: false };
}
function onMove(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.on) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
    drag.on = true;
    drag.x += Math.sign(dx) * 10;        // bỏ phần ngưỡng 10px, để thẻ không giật một phát lúc bắt đầu chạy
    try { $card.setPointerCapture(e.pointerId); } catch (_) {}
    $card.style.transition = 'none';
  }
  const dx = e.clientX - drag.x, dt = e.timeStamp - drag.t;
  if (dt > 0) drag.v = 0.8 * (dx - drag.dx) / dt + 0.2 * drag.v;   // vận tốc (px/ms), làm mượt cho đỡ nhiễu
  drag.dx = dx;
  drag.t = e.timeStamp;
  $card.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
}
function onUp(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const { on, dx } = drag;
  const v = e.timeStamp - drag.t < 50 ? drag.v : 0;       // dừng tay rồi mới thả thì không tính là hất
  drag = null;
  if (!on) return;
  $card.style.transition = '';
  // Đổi thẻ khi kéo đủ xa, hoặc khi hất nhanh theo đúng chiều đang kéo dù quãng ngắn
  const far = Math.abs(dx) > Math.min(100, $card.offsetWidth * 0.25);
  const flick = Math.abs(v) > 0.4 && Math.abs(dx) > 25 && v * dx > 0;
  if (e.type === 'pointerup' && (far || flick)) swipe(dx > 0 ? 1 : -1);
  else $card.style.transform = '';
}

/* ---------- Thông báo ---------- */
function toast(msg, actionLabel, action) {
  $toastMsg.textContent = msg;
  $toastAct.hidden = !actionLabel;
  $toastAct.textContent = actionLabel || '';
  $toastAct.onclick = actionLabel ? () => { hideToast(); action(); } : null;
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 5000 : msg.length > 60 ? 6000 : 3500);
}
function hideToast() { $toast.classList.remove('show'); }

/* ---------- Thêm và sửa từ ----------
   Mỗi từ một thẻ: gõ một từ đã có thì bảng chuyển sang sửa thẻ đó, không thêm thẻ trùng.
   Từ mới và bản sửa vào máy ngay, kể cả lúc không có mạng; lần đồng bộ sau mới ghi vào Sheet. */
function findWord(term) {
  const k = normTerm(term);
  return demo || !k ? null : items.find(x => normTerm(x.term) === k) || null;
}
/* Loại từ do người dùng tự tạo. Gợi ý gồm các loại ở tab types của Sheet và các loại đang dùng ở các thẻ,
   loại dùng nhiều đứng trước. Loại mới chỉ được lưu khi từ mang nó được lưu. */
function knownTypes() {
  const seen = new Map();                // normTerm(loại) → { type, uses, order }
  const add = (t, uses) => {
    const k = normTerm(t);
    if (!seen.has(k)) seen.set(k, { type: typeName(t), uses: 0, order: seen.size });
    seen.get(k).uses += uses;
  };
  types.forEach(x => add(x.type, 0));
  if (!demo) items.forEach(it => typesOf(it.type).forEach(t => add(t, 1)));
  return Array.from(seen.values()).sort((a, b) => b.uses - a.uses || a.order - b.order).map(x => x.type);
}
function checkedTypes() { return picked.slice(); }
// Chọn đúng các loại trong list, không đụng tới ô Nghĩa
function setTypes(list) {
  picked = [];
  list.forEach(t => { if (!picked.some(x => normTerm(x) === normTerm(t))) picked.push(typeName(t)); });
  renderTypes();
}
function sameTypes(a, b) {
  const x = new Set(a.map(normTerm)), y = new Set(b.map(normTerm));
  return x.size === y.size && Array.from(y).every(t => x.has(t));
}
// Viết tắt đặt trước nghĩa: cột abbr ở tab types; bỏ trống thì viết tắt quen thuộc, không có nữa thì nguyên tên
function abbr(type) {
  const k = normTerm(type);
  const t = types.find(x => normTerm(x.type) === k);
  return (t && t.abbr) || ABBR[k] || typeName(type);
}
// Vẽ lại các loại đã chọn trong ô, và hàng gợi ý bên dưới
function renderTypes() {
  $tags.querySelectorAll('.tag').forEach(el => el.remove());
  picked.forEach(t => {
    const el = document.createElement('span');
    el.className = 'tag';
    el.dataset.type = t;
    el.innerHTML = `<span>${esc(t)}</span><button type="button" aria-label="Bỏ loại ${esc(t)}">×</button>`;
    $tags.insertBefore(el, $typeIn);
  });
  $typeIn.placeholder = picked.length ? '' : 'Gõ để tìm hoặc thêm loại';
  renderSugg();
}
// Chưa gõ gì: gợi ý mọi loại chưa chọn. Đang gõ: chỉ các loại có chữ vừa gõ (khớp từ đầu thì đứng trước),
// cộng nút tạo loại mới nếu chưa loại nào trùng tên
function renderSugg() {
  const q = typeName($typeIn.value), k = normTerm(q);
  const chosen = new Set(picked.map(normTerm));
  const known = knownTypes();
  let list = known.filter(t => !chosen.has(normTerm(t)));
  if (k) {
    list = list.filter(t => normTerm(t).includes(k))
      .sort((a, b) => normTerm(b).startsWith(k) - normTerm(a).startsWith(k));
  }
  const button = (t, label) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.type = t;
    b.textContent = label || t;
    return b;
  };
  const chips = list.map(t => button(t));
  if (k && !chosen.has(k) && !known.some(t => normTerm(t) === k)) {
    const b = button(q, `+ Thêm “${q}”`);
    b.className = 'new';
    chips.push(b);
  }
  $sugg.replaceChildren(...chips);
}
// Chọn một loại: loại đã có thì giữ đúng cách viết đã có, chưa có thì thành loại mới.
// Chọn loại thứ hai trở đi: mỗi loại một dòng nghĩa mở đầu bằng (n), (v)…, các dòng chưa ghi loại là của loại chọn trước.
function pickType(name) {
  const t = typeName(name);
  $typeIn.value = '';
  if (t && !picked.some(x => normTerm(x) === normTerm(t))) {
    picked.push(knownTypes().find(x => normTerm(x) === normTerm(t)) || t);
    if (picked.length >= 2) {
      let ls = lines($meaning.value);
      if (ls.length && !ls.some(l => PREFIX.test(l))) {
        const first = abbr(picked[0]);
        ls = ls.map(l => `(${first}) ${l}`);
      }
      picked.forEach(x => {
        const tag = `(${abbr(x)})`;
        if (!ls.some(l => l.startsWith(tag))) ls.push(tag);
      });
      // dòng mới chỉ có (v) thì chừa sẵn dấu cách để gõ nghĩa tiếp
      $meaning.value = ls.map(l => l.replace(PREFIX, '').trim() ? l : l + ' ').join('\n');
    }
  }
  renderTypes();
  checkAdd();
}
// Bỏ một loại: chỉ xoá dòng nghĩa của loại đó nếu dòng còn trống
function unpickType(name) {
  const t = picked.find(x => normTerm(x) === normTerm(name));
  if (!t) return;
  picked = picked.filter(x => x !== t);
  const tag = `(${abbr(t)})`;
  $meaning.value = $meaning.value.split('\n').filter(l => l.trim() !== tag).join('\n');
  renderTypes();
  checkAdd();
}
// Nghĩa để lưu: bỏ dòng trống và dòng chỉ có (v) mà chưa ghi nghĩa
function cleanMeaning(v) { return lines(v).filter(l => l.replace(PREFIX, '').trim()).join('\n'); }
// Các dòng của a, thêm những dòng của b mà a chưa có
function mergeLines(a, b) {
  const ls = lines(a);
  lines(b).forEach(l => { if (!ls.includes(l)) ls.push(l); });
  return ls.join('\n');
}
function formState() {
  return { phonetic: $phonetic.value, types: checkedTypes(), meaning: $meaning.value, example: $example.value };
}
// Những ô trong bảng khác với thẻ
function formDiff(it) {
  const diff = {};
  const phonetic = $phonetic.value.trim();
  const meaning = cleanMeaning($meaning.value), example = lines($example.value).join('\n');
  if (phonetic !== (it.phonetic || '')) diff.phonetic = phonetic;
  if (meaning !== lines(it.meaning).join('\n')) diff.meaning = meaning;
  if (example !== lines(it.example).join('\n')) diff.example = example;
  if (!sameTypes(checkedTypes(), typesOf(it.type))) diff.type = checkedTypes().join(', ');
  return diff;
}
// Cần có từ. Đang sửa thì cần có ô khác thẻ, hoặc chữ gõ dở trong ô Loại từ mà thẻ chưa có (bấm lưu là thành loại mới)
function checkAdd() {
  const typed = normTerm($typeIn.value);
  const newType = !!typed && !picked.some(x => normTerm(x) === typed);
  $addSave.disabled = !$term.value.trim() || (!!editing && !Object.keys(formDiff(editing)).length && !newType);
}

// Gõ ra một từ đã có: chuyển sang sửa thẻ đó. Loại đã chọn và chữ đã gõ ở Nghĩa, Ví dụ được ghép vào thẻ;
// phiên âm đã gõ thì thay cho phiên âm của thẻ
function startEdit(it) {
  before = formState();
  setTypes(typesOf(it.type).concat(before.types));
  $phonetic.value = before.phonetic.trim() || it.phonetic || '';
  $meaning.value = mergeLines(it.meaning, before.meaning);
  $example.value = mergeLines(it.example, before.example);
  editing = it;
  filled = formState();
  $addTitle.textContent = 'Sửa từ';
  $addSave.textContent = 'Cập nhật';
  $addMsg.textContent = `“${it.term}” đã có trong bộ thẻ, bạn đang sửa thẻ này.${it.mastered ? ' Thẻ này đã nắm rõ.' : ''}`;
  $addMsg.hidden = false;
  $addDel.hidden = false;
}
// Thôi sửa. restore: ô nào chưa sửa từ lúc nạp thì trả về như trước khi nạp
function stopEdit(restore) {
  if (restore) {
    const now = formState();
    if (now.phonetic === filled.phonetic) $phonetic.value = before.phonetic;
    if (now.meaning === filled.meaning) $meaning.value = before.meaning;
    if (now.example === filled.example) $example.value = before.example;
    if (sameTypes(now.types, filled.types)) setTypes(before.types);
  }
  editing = before = filled = null;
  $addTitle.textContent = 'Thêm từ mới';
  $addSave.textContent = 'Thêm';
  $addMsg.hidden = true;
  $addDel.hidden = true;
}
function resetForm() {
  clearTimeout(lookupTimer);
  if (editing) stopEdit(false);
  $term.value = $phonetic.value = $typeIn.value = $meaning.value = $example.value = '';
  setTypes([]);
}
// Tra xem từ trong ô Từ đã có trong bộ thẻ chưa
function lookup() {
  clearTimeout(lookupTimer);
  const found = findWord($term.value);
  if (found !== editing) {
    if (editing) stopEdit(true);
    if (found) startEdit(found);
  }
  checkAdd();
}
function openAdd(it) {
  if (it) {                              // nút ✎: mở bảng sửa cho thẻ đang xem
    resetForm();
    $term.value = it.term;
    startEdit(it);
  } else {
    lookup();                            // bản nháp còn lại có thể trùng từ vừa đồng bộ về
  }
  renderSugg();                          // loại từ có thể vừa đổi sau lần đồng bộ
  checkAdd();
  if (!$add.open) $add.showModal();
}
function saveWord() {
  if (typeName($typeIn.value)) pickType($typeIn.value);  // loại gõ dở mà chưa bấm Enter cũng được tính
  if (!editing) {
    lookup();
    if (editing) return;                 // vừa nhận ra từ đã có: để bạn xem nội dung cũ rồi mới bấm Cập nhật
  }
  if ($addSave.disabled) { if (!$term.value.trim()) $term.focus(); return; }
  if (editing) updateWord(); else addWord();
}
function addWord() {
  const term = $term.value.trim();
  const it = {
    id: newId(), type: checkedTypes().join(', '), term, phonetic: $phonetic.value.trim(),
    meaning: cleanMeaning($meaning.value), example: lines($example.value).join('\n'),
    lastSeen: '', mastered: false, local: true
  };
  if (demo) { items = []; demo = false; }  // từ đầu tiên của bạn thay cho thẻ mẫu
  items.push(it);
  saved(it, `Đã thêm “${term}”. Bấm ↻ để gửi lên Sheet.`);
}
// Sửa thẻ trong máy ngay, và ghi lại bản sửa để gửi lên Sheet.
// Sửa nhiều lần trước khi đồng bộ thì giữ "from" của lần đầu; sửa về như cũ thì bỏ.
function updateWord() {
  const it = editing, diff = formDiff(it), ed = edits[it.id] || {};
  Object.keys(diff).forEach(name => {
    const from = ed[name] ? ed[name].from : it[name];
    if (from === diff[name]) delete ed[name]; else ed[name] = { from, to: diff[name] };
  });
  if (Object.keys(ed).length) edits[it.id] = ed; else delete edits[it.id];
  Object.assign(it, diff);
  saved(it, `Đã sửa “${it.term}”. Bấm ↻ để gửi lên Sheet.`);
}
function saved(it, msg) {
  resetForm();
  $add.close();
  show(it);
  renderTop();
  if (persist()) toast(msg);
}

// Xoá từ đang sửa: hỏi lại trước khi xoá
function askDelete() {
  const it = editing;
  if (!it) return;
  $delTitle.textContent = `Xoá “${it.term}”?`;
  $delText.textContent = it.local && !it.tried
    ? 'Từ này chưa lên Sheet, xoá rồi là mất hẳn.'
    : 'Thẻ sẽ mất khỏi bộ thẻ, và dòng của từ này trong Sheet bị xoá ở lần đồng bộ kế tiếp.';
  $del.showModal();
}
function deleteWord() {
  const it = editing;
  $del.close();
  if (!it) return;
  items = items.filter(x => x !== it);
  delete pending[it.id];
  delete edits[it.id];
  // Từ chưa từng gửi lên Sheet thì không cần báo script. Còn lại thì xoá dòng trong Sheet ở lần đồng bộ sau
  const inSheet = !it.local || it.tried || syncing;
  if (inSheet) deletes[it.id] = { term: it.term };
  resetForm();
  $add.close();
  if (current === it) next(); else renderCard();
  renderTop();
  if (persist()) toast(inSheet ? `Đã xoá “${it.term}”. Bấm ↻ để xoá trong Sheet.` : `Đã xoá “${it.term}”.`);
}

/* ---------- Đồng bộ với Google Sheet ---------- */
async function sync() {
  if (syncing) return;
  if (!sheetIdOf(settings.sheet) || !scriptUrl()) { openSettings(); return; }
  syncing = true;
  $sync.classList.add('busy');
  const sending = pending;
  pending = {};
  const fixing = edits;                          // sửa thêm trong lúc chờ thì vào edits mới, gửi lần sau
  edits = {};
  const dropping = deletes;                      // xoá thêm trong lúc chờ cũng vậy
  deletes = {};
  const adding = items.filter(x => x.local);
  adding.forEach(x => { x.tried = true; });      // đã gửi đi: xoá từ này sau đó thì phải báo cả Sheet
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const changes = Object.keys(sending).map(id => Object.assign({ id }, sending[id]));
    const fixes = Object.keys(fixing).map(id => Object.assign({ id }, fixing[id]));
    const removes = Object.keys(dropping).map(id => ({ id, term: dropping[id].term }));
    // body là chuỗi nên trình duyệt gửi dạng text/plain, Apps Script nhận được mà không vướng CORS
    const res = await fetch(scriptUrl(), {
      method: 'POST',
      body: JSON.stringify({ sheet: sheetIdOf(settings.sheet), key: settings.key, changes, adds: adding, edits: fixes,
        deletes: removes }),
      signal: ctrl.signal
    });
    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch (_) {}
    if (!data || typeof data !== 'object') {
      throw new Error(settings.url
        ? 'Link chưa đúng. Dùng link Web app đuôi /exec, quyền truy cập Anyone.'
        : 'Script chung đang trục trặc, thử lại sau.');
    }
    if (!data.ok) throw new Error(`Sheet báo lỗi: ${data.error || 'không rõ'}.`);
    if (data.key) {                              // script vừa thiết lập Sheet trống và tạo mã
      settings.key = String(data.key);
      store(KEYS.settings, settings);
    }

    const wasDemo = demo;
    demo = false;
    // Script mới trả về danh sách loại từ (types). Script cũ chưa biết phiên âm: nhận từ mới và bản sửa nhưng bỏ qua phiên âm
    const modern = Array.isArray(data.types);
    if (modern) {
      types = data.types.filter(x => x && typeName(x.type))
        .map(x => ({ type: typeName(x.type), abbr: String(x.abbr == null ? '' : x.abbr).trim() }));
      store(KEYS.types, types);
    }
    const got = (Array.isArray(data.items) ? data.items : []).map(fill);
    const ids = new Set(got.map(x => x.id));
    // Bản sửa: Sheet đã có nội dung mới thì xong; nằm trong conflicts thì Sheet giữ bản của nó;
    // script cũ chưa biết sửa (không trả conflicts), hay chưa biết phiên âm, thì giữ lại gửi lần sau
    const conflicts = Array.isArray(data.conflicts) ? data.conflicts : null;
    const lost = [];
    let kept = false;
    Object.keys(fixing).forEach(id => {
      const it = got.find(x => x.id === id);
      const done = name => it[name] === fixing[id][name].to && (modern || name !== 'phonetic');
      if (it && Object.keys(fixing[id]).every(done)) return;
      if (!conflicts) { keepEdits({ [id]: fixing[id] }); kept = true; }
      else if (conflicts.includes(id)) lost.push(it ? it.term : '');
      else if (!modern && fixing[id].phonetic) { keepEdits({ [id]: { phonetic: fixing[id].phonetic } }); kept = true; }
    });
    if (!modern) {
      // Script cũ ghi từ mới nhưng bỏ phiên âm: giữ phiên âm lại thành một bản sửa, gửi lần sau
      adding.forEach(a => {
        const it = got.find(x => x.id === a.id);
        if (!it || !a.phonetic || deletes[a.id]) return;
        const ed = edits[a.id] || (edits[a.id] = {});
        ed.phonetic = { from: it.phonetic, to: ed.phonetic ? ed.phonetic.to : a.phonetic };
        kept = true;
      });
      // Script cũ không trả phiên âm về: thẻ giữ phiên âm đang có trong máy
      const mine = new Map(items.map(x => [x.id, x]));
      got.forEach(x => { if (mine.has(x.id)) x.phonetic = mine.get(x.id).phonetic || ''; });
    }
    // Từ đã xoá: script mới trả lại id đã xoá trong deleted. Nằm trong conflicts thì Sheet giữ dòng đó (term vừa bị đổi);
    // script cũ chưa biết xoá (không trả deleted) thì giữ lại gửi lần sau
    const gone = Array.isArray(data.deleted) ? data.deleted : null;
    const undeleted = [];
    Object.keys(dropping).forEach(id => {
      if (gone && gone.includes(id)) return;
      if (gone && conflicts && conflicts.includes(id)) undeleted.push(dropping[id].term);
      else { deletes[id] = dropping[id]; kept = true; }
    });
    // Từ mới Sheet chưa nhận thì giữ lại trong máy: từ thêm trong lúc chờ đồng bộ, hoặc script còn là bản cũ.
    // Từ đã xoá mà Sheet chưa xoá thì vẫn ẩn
    items = got.concat(items.filter(x => x.local && !ids.has(x.id))).filter(x => !deletes[x.id]);
    const outdated = kept || adding.some(x => !ids.has(x.id));
    Object.keys(pending).forEach(id => {        // thao tác làm trong lúc đang chờ đồng bộ
      const it = items.find(x => x.id === id);
      if (it) Object.assign(it, pending[id]);
    });
    applyEdits();
    lastSync = new Date().toISOString();
    store(KEYS.lastSync, lastSync);
    persist();
    const same = !wasDemo && current ? items.find(x => x.id === current.id && !x.mastered) : null;
    if (same) show(same); else next();
    toast(data.key ? `Đã thiết lập Sheet, mã bí mật là ${data.key}. Xem lại trong ⚙.`
      : outdated ? 'Script chưa được cập nhật nên chưa nhận thay đổi từ app. Thay đổi vẫn lưu trong máy.'
      : lost.length === 1 && lost[0] ? `Bản sửa “${lost[0]}” không được ghi vì từ này vừa đổi trong Sheet.`
      : lost.length ? `${lost.length} bản sửa không được ghi vì từ đã đổi hoặc bị xoá trong Sheet.`
      : undeleted.length === 1 ? `“${undeleted[0]}” không xoá được vì từ này vừa đổi trong Sheet.`
      : undeleted.length ? `${undeleted.length} từ không xoá được vì vừa đổi trong Sheet.`
      : `Đã đồng bộ ${got.length} thẻ`);
  } catch (err) {
    Object.keys(sending).forEach(id => { pending[id] = Object.assign({}, sending[id], pending[id]); });
    keepEdits(fixing);
    Object.assign(deletes, dropping);
    persist();
    toast(!navigator.onLine ? 'Chưa có mạng. Thay đổi vẫn lưu trong máy, có mạng thì bấm đồng bộ lại.'
      : err.name === 'AbortError' ? 'Script không trả lời sau 30 giây. Bấm đồng bộ lại.'
      : err instanceof TypeError ? 'Không gọi được script. Kiểm tra mạng và link trong ⚙.'
      : err.message);
  } finally {
    clearTimeout(timer);
    syncing = false;
    $sync.classList.remove('busy');
    renderTop();
  }
}

/* ---------- Cài đặt ---------- */
function openSettings() {
  $sheet.value = settings.sheet;
  $key.value = settings.key;
  $url.value = settings.url;
  const n = unsynced();
  $info.textContent = (lastSync ? `Đồng bộ gần nhất lúc ${fmtDateTime(lastSync)}.` : 'Chưa đồng bộ lần nào.')
    + (n ? ` Còn ${n} thay đổi chưa gửi lên Sheet.` : '');
  if (!$dlg.open) $dlg.showModal();
}
function saveSettings() {
  settings = { sheet: $sheet.value.trim(), key: $key.value.trim(), url: $url.value.trim() };
  const saved = store(KEYS.settings, settings);
  $dlg.close();
  if (!saved) { toast('Không lưu được cài đặt vào máy.'); return; }
  if (!settings.sheet) return;
  if (!sheetIdOf(settings.sheet)) {
    toast('Link Sheet cần có dạng https://docs.google.com/spreadsheets/d/…');
    return;
  }
  if (settings.url && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(settings.url)) {
    toast('Link script cần có dạng https://script.google.com/…/exec');
    return;
  }
  if (!scriptUrl()) { toast('Chưa có script chung, hãy dán link Apps Script của bạn.'); return; }
  sync();
}

/* ---------- Khởi động ---------- */
function init() {
  const $ = id => document.getElementById(id);
  $card = $('card'); $stats = $('stats'); $badge = $('badge'); $sync = $('btnSync');
  $master = $('btnMaster'); $next = $('btnNext'); $hint = $('hint'); $toast = $('toast'); $toastMsg = $('toastMsg');
  $toastAct = $('toastAct'); $dlg = $('dlg'); $sheet = $('inSheet'); $key = $('inKey'); $url = $('inUrl');
  $help = $('help'); $info = $('info');
  $add = $('dlgAdd'); $addTitle = $('addTitle'); $addMsg = $('addMsg');
  $term = $('inTerm'); $phonetic = $('inPhonetic'); $tags = $('tags'); $typeIn = $('inType'); $sugg = $('sugg');
  $meaning = $('inMeaning'); $example = $('inExample'); $addSave = $('btnAddSave');
  $addDel = $('btnAddDel'); $del = $('dlgDel'); $delTitle = $('delTitle'); $delText = $('delText');
  if (SHARED_URL) {
    $('lblUrl').textContent = 'Link Apps Script riêng (không bắt buộc)';
    $url.placeholder = 'Bỏ trống để dùng script chung';
    if (BOT_EMAIL) {
      $help.textContent = `Dùng script chung thì chia sẻ Sheet cho ${BOT_EMAIL} với quyền Người chỉnh sửa.`;
      $help.hidden = false;
    }
  }

  items = load(KEYS.items, []).map(fill);
  pending = load(KEYS.pending, {});
  edits = load(KEYS.edits, {});
  deletes = load(KEYS.deletes, {});
  types = load(KEYS.types, []);
  if (!Array.isArray(types)) types = [];
  settings = Object.assign({ sheet: '', key: '', url: '' }, load(KEYS.settings, {}));
  lastSync = load(KEYS.lastSync, '');
  if (!items.length && !lastSync) {
    items = DEMO.map(x => Object.assign({}, x));
    demo = true;
  }
  next();
  renderTop();
  renderTypes();

  $card.addEventListener('pointerdown', onDown);
  $card.addEventListener('pointermove', onMove);
  $card.addEventListener('pointerup', onUp);
  $card.addEventListener('pointercancel', onUp);
  $master.addEventListener('click', master);
  $next.addEventListener('click', () => swipe(-1));
  $sync.addEventListener('click', sync);
  $('btnSettings').addEventListener('click', openSettings);
  $('btnSave').addEventListener('click', saveSettings);
  $('btnClose').addEventListener('click', () => $dlg.close());
  [$sheet, $key, $url].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') saveSettings(); }));
  $('btnAdd').addEventListener('click', () => openAdd());
  $card.addEventListener('click', e => { if (!busy && current && e.target.closest('.edit')) openAdd(current); });
  $addSave.addEventListener('click', saveWord);
  $('btnAddClose').addEventListener('click', () => $add.close());
  $addDel.addEventListener('click', askDelete);
  $('btnDelCancel').addEventListener('click', () => $del.close());
  $('btnDelOk').addEventListener('click', deleteWord);
  $add.addEventListener('close', () => { if (editing) resetForm(); });  // đóng bảng sửa thì bỏ phần chưa bấm Cập nhật
  // Ngừng gõ ô Từ một chút thì tra xem từ đã có chưa
  $term.addEventListener('input', () => {
    checkAdd();
    clearTimeout(lookupTimer);
    lookupTimer = setTimeout(() => { if ($add.open) lookup(); }, 400);
  });
  [$phonetic, $meaning, $example].forEach(el => el.addEventListener('input', checkAdd));
  // Loại từ: chạm gợi ý để chọn, chạm × để bỏ, chạm vào ô để gõ. Nhấn giữ trên nút không lấy focus khỏi ô đang gõ,
  // để bàn phím điện thoại không bị đóng rồi mở lại
  $sugg.addEventListener('mousedown', e => e.preventDefault());
  $sugg.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const keyboard = document.activeElement === b;      // chọn bằng Tab rồi Enter: trả focus về ô gõ
    pickType(b.dataset.type);
    if (keyboard) $typeIn.focus();
  });
  $tags.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  $tags.addEventListener('click', e => {
    const x = e.target.closest('.tag button');
    if (!x) { $typeIn.focus(); return; }
    const keyboard = document.activeElement === x;
    unpickType(x.parentNode.dataset.type);
    if (keyboard) $typeIn.focus();
  });
  $typeIn.addEventListener('input', () => {
    if ($typeIn.value.includes(',')) {                  // gõ dấu phẩy là xong một loại
      const parts = $typeIn.value.split(',');
      const rest = parts.pop();
      parts.forEach(t => pickType(t));
      $typeIn.value = rest.replace(/^\s+/, '');
    }
    renderSugg();
    checkAdd();
  });
  // Ô Loại từ đang trống mà bấm xoá lùi thì bỏ loại cuối cùng
  $typeIn.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !$typeIn.value && picked.length && !e.isComposing) unpickType(picked[picked.length - 1]);
  });
  // Enter ở ô Từ: tra từ rồi sang ô Phiên âm; ở ô Phiên âm: sang ô Loại từ; ở ô Loại từ: chọn loại vừa gõ, ô trống thì
  // sang ô Nghĩa. Ctrl+Enter (Mac: ⌘+Enter) ở ô nào cũng là bấm nút chính
  $add.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); saveWord(); }
    else if (e.target === $term) { e.preventDefault(); lookup(); $phonetic.focus(); }
    else if (e.target === $phonetic) { e.preventDefault(); $typeIn.focus(); }
    else if (e.target === $typeIn) {
      e.preventDefault();
      if (typeName($typeIn.value)) pickType($typeIn.value); else $meaning.focus();
    }
  });
  document.addEventListener('keydown', e => {
    if ($dlg.open || $add.open) return;
    if (e.key === 'ArrowRight') swipe(1);
    else if (e.key === 'ArrowLeft') swipe(-1);
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

if (typeof document !== 'undefined') init();
</script>
</body>
</html>
